id: commodore-1581-psu
machine: commodore-1581
board: psu
revisions:
  - P/N 312551-01 (120 VAC/60 Hz variant)
verification: derived
sources:
  - url: http://www.zimmers.net/anonftp/pub/cbm/schematics/drives/new/1581/powersupply.gif
    note: >-
      Reverse-engineered schematic "commodore 1541-II/1571-II/1581 POWER
      SUPPLY", P/N 312551-01, drawn by William Levak from the physical unit
      (Zimmers/funet CBM archive). Retrieved and read directly for component
      values and designators.
notes:
  - >-
    This list describes the 120 VAC/60 Hz (US/Japan) input version, which
    carries no mains-side X2 film capacitor anywhere in the circuit. Whether
    the 220-240 V export variant adds a line-side X2 filter ahead of the
    transformer is not known. Inspect the unit before assuming an X2
    capacitor is present to replace.
  - >-
    P/N 312551-01 is one design shared by the 1541-II, 1571-II and 1581
    external bricks.
  - >-
    C7, C8, C10 and C11 (0.02 uF) are small ceramic/film bypass positions on
    the DC side of the rectifiers, not electrolytics, and are out of scope
    for this list.
capacitors:
  - designators:
      - C1
    type: electrolytic-radial
    capacitance_uf: 2200
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
    note: +12V rail primary filter, after the D3/D4 bridge, ahead of IC2 (7812).
  - designators:
      - C2
    type: electrolytic-radial
    capacitance_uf: 4700
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
    note: +5V rail primary filter, after the D1/D2 bridge, ahead of IC1 (3522).
  - designators:
      - C4
    type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 50
    quantity: 1
    series: panasonic-fr
    note: Input-side filter for IC2 (7812, +12V regulator).
  - designators:
      - C5
    type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 50
    quantity: 1
    series: panasonic-fr
    note: Input-side filter for IC1 (3522 regulator, +5V branch).
