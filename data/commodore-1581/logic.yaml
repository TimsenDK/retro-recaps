id: commodore-1581-logic
machine: commodore-1581
board: logic
revisions:
  - PCB Assembly 250471-01
verification: verified
sources:
  - url: https://www.manualslib.com/manual/1441735/Commodore-Computers-1581.html?page=15
    note: >-
      Scan of the official Commodore 1581 Service Manual (314982-01),
      "Parts List - Major/Component" page. Lists reference designators,
      values and Commodore stock part numbers for every capacitor on the
      logic board.
notes:
  - >-
    The board carries three electrolytic positions: C18 and C22 (10 uF 25 V)
    and C20 (47 uF, originally 10 V). There is no 100 uF and no 470 uF
    electrolytic position anywhere on it.
  - >-
    C1-C14 (0.1 uF/16 V) and C15 (0.1 uF/50 V) are ceramic bypass capacitors
    and are out of scope for this electrolytic recap list.
  - >-
    This list has not been checked against a physical unit. Count on the
    board before ordering.
capacitors:
  - designators:
      - C18
      - C22
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 25
    quantity: 2
    series: panasonic-fr
    note: Original Commodore part 900100-01.
  - designators:
      - C20
    type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 25
    original_voltage_v: 10
    quantity: 1
    series: panasonic-fr
    note: >-
      Original Commodore part 900100-12, rated 47 uF 10 V with -10/+50%
      tolerance. Voltage upgraded per project convention.
