id: commodore-1581
name: Commodore 1581
family: commodore-drive
released: '1987'
about: >-
    A 3½-inch drive holding 800 KB a disk — the largest-capacity serial bus
    drive Commodore made. It supports partitions and a far larger directory
    than its predecessors, and was a favourite of bulletin board operators.
wikipedia: https://en.wikipedia.org/wiki/Commodore_1581
aliases:
  - CBM 1581
  - 1581 3.5"
board_order:
  - logic
  - psu
notes:
  - >-
    The external PSU brick, P/N 312551-01, is one shared design across the
    1541-II, 1571-II and 1581; see psu.yaml. Nothing inside the drive itself
    carries mains voltage.
  - >-
    The brick's design has been reverse-engineered into a full
    component-level schematic, which is why a capacitor list for it exists at
    all. That is not the same as the unit being serviceable: these bricks are
    reported to be filled with potting resin, with no non-destructive way to
    open one. Whether a particular unit can be opened and recapped, or has to
    be replaced whole, is a judgement call for whoever has it on the bench.
