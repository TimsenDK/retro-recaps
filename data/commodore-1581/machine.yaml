id: commodore-1581
name: Commodore 1581
family: commodore-drive
board_order:
  - logic
  - psu
notes:
  - >-
    The external PSU brick, P/N 312551-01, is one shared design across the
    1541-II, 1571-II and 1581; see psu.yaml.
  - >-
    Unlike the C64's PSU brick, this unit appears to be a conventional PCB
    in a sealed case rather than an epoxy-potted block - it has been
    reverse-engineered into a full component-level schematic. Whether a
    given unit can be opened non-destructively for recapping, rather than
    being replaced whole, is a judgement call for whoever has it on the
    bench.
