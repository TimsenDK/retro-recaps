id: amiga-500-mainboard-rev5
machine: amiga-500
board: mainboard
revisions:
  - "5"
verification: derived
sources:
  - url: https://support.retrorewind.ca/en/blog/amiga-500-cap-list
    note: >-
      Rev 5 capacitor list with reference designators.
  - url: https://jeremykline.us/2026/02/14/amiga-capacitor-lists/
    note: >-
      Independent transcription of the Rev 5 board (Artwork No 312513)
      original capacitor values. Designators and quantities match
      retrorewind's list; also gives the original (pre-recap) voltages.
  - url: https://archive.org/stream/system-schematics-a-500-revisions-5-6a-7/System%20Schematics%20A500%20Revisions%205,%206A,%207_djvu.txt
    note: >-
      Official Commodore system schematics and parts list for PCB assembly
      312510, Rev 5 (also covering Rev 6A/7). Gives the same designators and
      values independently.
notes:
  - >-
    Rev 3 and rev 5 use the same capacitor values and quantities. The two
    boards differ in physical layout, so a position is not guaranteed to sit
    in the same place on both revisions.
  - Positions are radial, 5 mm lead pitch.
capacitors:
