id: amiga-500-mainboard-rev5
machine: amiga-500
board: mainboard
revisions:
  - "5"
verification: verified
notes:
  - >-
    Rev 3 and rev 5 use the same capacitor values and quantities. The two
    boards differ in physical layout, so a position is not guaranteed to sit
    in the same place on both revisions.
  - >-
    The factory ratings on this board are 100 uF 16 V and 47 uF 16 V. The
    25 V and 50 V figures that circulate for those positions are
    replacement values, not what the board shipped with.
  - >-
    Assembly number 312510 is printed on rev 3, rev 5, rev 6A and rev 7
    boards alike, so it does not identify the revision. The revision is
    silkscreened separately.
  - Positions are radial, 5 mm lead pitch.
