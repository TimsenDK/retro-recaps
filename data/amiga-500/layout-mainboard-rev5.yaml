id: amiga-500-layout-mainboard-rev5
board: amiga-500-mainboard-rev5
precision: measured
verification: derived
orientation: >-
  As drawn here (the source page rotated 90 degrees clockwise so its text
  reads left to right), the top edge carries the keyboard, floppy and
  expansion ribbon-cable headers (silkscreened CN5, CN6, CN7); the bottom
  edge carries the CIA/Gary support components and the 512K RAM expansion
  connector (ASSY 312604); the left edge carries the video output, Denise,
  CPU and ROM; the right edge is blank margin, captioned "A500 SYSTEM
  SCHEMATICS" in the source document.
outline:
  width: 1445
  height: 1000
notes:
  - >-
    The drawing gives no scale or physical dimensions, so positions are
    normalised to the drawn board outline rather than to millimetres.
