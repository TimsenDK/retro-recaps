  - "312812"
verification: derived
battery: true
notes:
  - >-
    This is the A500+ board. It drops the two 3300 uF filter capacitors used
    on rev 3/5/6A and carries three 1000 uF/10 V positions instead, at C307,
    C401 and C402. A kit for any earlier revision does not fit it.
  - >-
    Rev 8A.1 carries the same capacitor complement as rev 8A. The two boards
    differ in the routing of the battery charging circuit around D911 and
    D912.
  - >-
    The factory ratings on the 47 uF and 10 uF positions are documented
    inconsistently; the higher figure is recorded, and the replacement
    rating is safe under either reading.
