  - 8A.1
  - "312812"
verification: derived
battery: true
sources:
  - url: https://www.amibay.com/threads/a500-rev-8a-1-which-capacitors-i-need.47238/
    note: >-
      Forum transcription of the A500+ service manual, page 24. Gives
      values, factory voltage ratings, quantities and package sizes; no
      3300 uF filter capacitors appear on this board, and no designators
      are given.
  - url: https://wiki.console5.com/wiki/Amiga_500
    note: >-
      "Main Board: 312812 Rev 8" designator list. The value groups and
      counts match the service manual transcription exactly and supply the
      designators it omits.
  - url: https://www.amibay.com/threads/difference-a500-rev-8a-and-8a-1.82345/
    note: >-
      Owner comparison of rev 8A and rev 8A.1 boards. The only difference
      reported is a routing correction around D911/D912 in the battery
      charging circuit.
notes:
  - >-
    This is the A500+ board. It drops the two 3300 uF filter capacitors used
    on rev 3/5/6A and carries three 1000 uF/10 V positions instead, at C307,
    C401 and C402. A kit for any earlier revision does not fit it.
  - >-
    Rev 8A.1 carries the same capacitor complement as rev 8A. The two boards
    differ in the routing of the battery charging circuit around D911 and
    D912.
  - >-
    The factory ratings on the 47 uF and 10 uF positions are documented
    inconsistently; the higher figure is recorded, and the replacement
    rating is safe under either reading.
