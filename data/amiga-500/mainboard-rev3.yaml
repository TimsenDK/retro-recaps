id: amiga-500-mainboard-rev3
machine: amiga-500
board: mainboard
revisions:
  - "3"
verification: derived
notes:
  - >-
    Rev 3 and rev 5 use the same capacitor values and quantities. The two
    boards differ in physical layout, so a position is not guaranteed to sit
    in the same place on both revisions.
  - >-
    No published document covers rev 3 by name, so the values here are read
    across from rev 5 and the reference designators for this revision are
    not established. Read them off the board before ordering.
  - Positions are radial, 5 mm lead pitch.
