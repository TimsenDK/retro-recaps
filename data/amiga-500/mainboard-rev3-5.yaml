id: amiga-500-mainboard-rev3-5
machine: amiga-500
board: mainboard
revisions:
  - "3"
  - "5"
verification: verified
sources:
  - url: https://support.retrorewind.ca/en/blog/amiga-500-cap-list
    note: >-
      Combined Rev 3/5 capacitor list with reference designators (the source
      the project handover cites for these revisions).
  - url: https://jeremykline.us/2026/02/14/amiga-capacitor-lists/
    note: >-
      Independent transcription of the Rev 5 board (Artwork No 312513)
      original capacitor values. Designators and quantities match
      retrorewind's list; also gives the original (pre-recap) voltages.
notes:
  - >-
    Rev 3 and Rev 5 share one capacitor set. The two revisions differ in
    RAM-chip identification and expansion-connector via routing, not in the
    power or audio section.
  - Positions are radial, 5 mm lead pitch.
capacitors:
