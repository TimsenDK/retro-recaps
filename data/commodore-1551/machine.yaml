id: commodore-1551
name: Commodore 1551
family: commodore-drive
board_order:
  - mainboard
notes:
  - The 1551 has an internal power supply (regulators mounted on the single
    main PCB). An earlier pass of this dataset listed it as external; that was
    an error and has been corrected.
  - No public capacitor list for the 1551 was known when this entry was first
    drafted; the source spreadsheet assumed the board was cap-equivalent to
    the 1541. That assumption turned out to be wrong once the official
    Commodore schematic was located — see the mainboard notes.
