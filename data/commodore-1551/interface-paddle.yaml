id: commodore-1551-interface-paddle
machine: commodore-1551
board: paddle
revisions:
  - "250453"
verification: unverified
notes:
  - >-
    The interface paddle is the small PCB on the end of the 1551's cable that
    plugs into the computer's cartridge port. It is a logic board - a 6523 TPI
    and an 82S100 PLA address decoder - fed from the computer's regulated 5 V
    rail, with no supply section of its own.
  - >-
    Open: whether it carries any electrolytic at all is not established. A
    board of this kind may legitimately have none, and no published parts list
    names one. Look at the board before assuming there is anything to replace.
capacitors: []
