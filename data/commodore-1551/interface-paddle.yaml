id: commodore-1551-interface-paddle
machine: commodore-1551
board: paddle
revisions:
  - "250453"
verification: unverified
sources:
  - url: https://www.zimmers.net/anonftp/pub/cbm/schematics/drives/new/1551/index.html
    note: >-
      Archive index describing paddle-251925 as the interface paddle that
      plugs into the cartridge port, with a PLA address decoder and a 6523
      TPI.
  - url: https://www.zimmers.net/anonftp/pub/cbm/schematics/drives/new/1551/parts.txt
    note: >-
      Commodore 1551 parts list composed by William Levak. For the interface
      cartridge it gives U2 = 6523 TPI and U1 = 82S100 PLA (251641-03), and
      lists no capacitors.
  - url: https://myoldcomputer.nl/technical-info/mainboards/drive-mainboards/board-250449250453-1551/
    note: >-
      Board register entry giving 250453 as the interface paddle assembly and
      251925 as its schematic.
notes:
  - >-
    The interface paddle is the small PCB on the end of the 1551's cable that
    plugs into the computer's cartridge port. It is a logic board - a 6523 TPI
    and an 82S100 PLA address decoder - fed from the computer's regulated 5 V
    rail, with no supply section of its own.
  - >-
    Open: whether it carries any electrolytic at all is not established. A
    board of this kind may legitimately have none, and no published parts list
    names one. Look at the board before assuming there is anything to replace.
capacitors: []
