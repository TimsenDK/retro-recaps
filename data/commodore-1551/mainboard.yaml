id: commodore-1551-mainboard
machine: commodore-1551
board: mainboard
revisions:
  - Schematic 251860 rev. 4
verification: verified
sources:
  - url: http://www.zimmers.net/anonftp/pub/cbm/schematics/drives/new/1551/251860.gif
    note: >-
      Official Commodore engineering schematic "SCHEMATIC DIAGRAM, 1551",
      drawing 251860 rev. 4, drawn by R. Vida, checked by S. Katayama (Zimmers
      / funet CBM archive). Retrieved and read directly for the internal PSU
      section (bridge rectifiers DB1/DB2, REG1 = LM340-12, REG2 = LM340-05)
      and its capacitor designators and values.
notes:
  - >-
    This board is not capacitor-equivalent to the 1541. Only C25 (4700 uF/16
    V) coincides with a 1541 value; the 1 uF, 47 uF, 100 uF and 220 uF
    positions found on 1541 boards do not exist here.
  - >-
    Small ceramic bypass capacitors run throughout the logic section
    (roughly the C1-C14 range, 0.01-0.1 uF) and on the PSU rails (C24, C26,
    C28, 0.1 uF). These are not electrolytics and are out of scope for this
    recap list.
  - >-
    These positions have not been counted against a physical board. Confirm
    designators and values against the PCB before ordering, in case later
    board revisions moved or changed values.
capacitors:
  - designators:
      - C21
    type: electrolytic-radial
    capacitance_uf: 6800
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
    note: +12V rail primary filter, after bridge rectifier DB2.
  - designators:
      - C22
    type: electrolytic-radial
    capacitance_uf: 8.2
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
    note: +12V rail input filter, in parallel with C21.
  - designators:
      - C23
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
    note: +12V rail output filter, after REG1 (LM340-12).
  - designators:
      - C25
    type: electrolytic-radial
    capacitance_uf: 4700
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
    note: +5V rail primary filter, after bridge rectifier DB1.
  - designators:
      - C27
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
    note: +5V rail output filter, after REG2 (LM340-05).
