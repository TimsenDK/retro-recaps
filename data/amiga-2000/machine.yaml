id: amiga-2000
name: Commodore Amiga 2000
family: amiga
aliases:
  - A2000
  - A2000-A
  - B2000
board_order:
  - mainboard
  - psu
notes:
  - >-
    Two mainboard families are in scope and are recorded as separate files:
    rev 4.x and rev 6.x. They are genuinely different boards and their
    capacitor complements differ.
  - >-
    "Rev 4" covers two unlike PCBs - the German A2000-A, whose revision is
    unnumbered, and the numbered revisions 4.0 to 4.5 of the B2000 design -
    and the revisions within the numbered family differ from one another at
    capacitor positions. Which of them the rev 4.x file describes is not
    established.
  - >-
    Rev 5.0 exists, differing from rev 4.x in using 256k x 4 RAM chips
    instead of 256k x 1. Its capacitor complement is not published anywhere
    retrievable and it is not covered here.
  - >-
    The EU/230 V power supply is shared between rev 4.4 and rev 6.x
    machines. It carries mains, and its exact electrolytic values are not
    settled; see the psu file.
batteries:
  - kind: nicd
    action: remove
    note: >-
      Barrel-style NiCd battery soldered to the mainboard, backing up the
      real-time clock. It leaks and corrodes the board and its traces.
      Remove it. If clock retention is wanted, fit a non-rechargeable cell
      in a holder off the board; do not fit another rechargeable cell in its
      place.
