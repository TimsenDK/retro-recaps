id: amiga-2000-mainboard-rev4x
machine: amiga-2000
board: mainboard
revisions:
  - 4.x
verification: derived
battery: true
sources:
  - url: https://www.amiga-shop.net/en/Amiga-Hardware/Amiga-classic-hardware/Amiga-2000-repair-kit::989.html
    note: >-
      Kit vendor selling separate Rev 4 and Rev 6 kits with different
      declared contents; the Rev 4 contents are the complement recorded
      here. No designators and no voltage ratings are given, and no board
      revision beyond "Rev 4" is named.
  - url: http://amiga.resource.cx/mod/a2000.html
    note: >-
      Revision register for the Amiga 2000 family, distinguishing the
      unnumbered rev 4 A2000-A from the numbered revs 4.0 to 4.5 and
      recording that rev 4.2 removes filter capacitors.
notes:
  - >-
    A NiCd barrel battery for the real-time clock is soldered to this board.
    It leaks and corrodes the traces around it; remove it before doing
    anything else, and inspect that area for damage.
  - >-
    Two different PCB families answer to "rev 4". The German A2000-A is a
    four-layer board derived from the A1000 design, with no Buster and no
    Gary, sixteen 256x1 DRAMs and a single video slot. Revisions 4.0 to 4.5
    are the two-layer B2000 design with 1 MB of RAM, Buster and Gary, and
    two video slots. Which of the two this list describes is not
    established, so treat it as a starting count rather than a bill of
    materials, and check every position against the board.
  - >-
    The revisions within the numbered family also differ at capacitor
    positions: rev 4.2 removes the pair at C910 and C911 that rev 4.0 and
    rev 4.1 carry, so a 4.1 board and a 4.2 board do not hold the same
    number of parts.
  - >-
    Rev 4.x differs from rev 6.x in the 47 uF group: nine positions here
    against thirteen there. It also carries one 100 uF position that rev 6.x
    does not have. Both revisions carry three 4.7 uF positions. 29 positions
    in total, against 32 on rev 6.x.
  - >-
    No reference designators and no voltage ratings are recorded for this
    revision anywhere retrievable.
  - >-
    Voltages on the four value groups shared with rev 6.x (4.7 uF, 22 uF, 47
    uF and 470 uF) are assumed to match that revision. They are not
    confirmed for rev 4.x itself.
  - >-
    The nine 47 uF positions come in two physical case sizes, four of one
    and five of the other. They are recorded as one group because no
    dimensions are known; do not assume the parts are interchangeable on the
    board.
