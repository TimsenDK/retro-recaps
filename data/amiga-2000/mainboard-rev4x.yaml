id: amiga-2000-mainboard-rev4x
machine: amiga-2000
board: mainboard
revisions:
  - 4.x
verification: derived
sources:
  - url: https://www.amiga-shop.net/en/Amiga-Hardware/Amiga-classic-hardware/Amiga-2000-repair-kit::989.html
    note: >-
      Alinea/Amiga-Shop.net sells separate Rev 4 and Rev 6 kits with different
      declared contents; used here as the per-revision breakdown for rev 4.x.
      No designators or voltage ratings are given on the page.
notes:
  - >-
    Rev 4.x differs from rev 6.x in the 47 uF group: nine positions here
    against thirteen there. It also carries one 100 uF position that rev 6.x
    does not have. Both revisions carry three 4.7 uF positions. 29 positions
    in total, against 32 on rev 6.x.
  - >-
    No reference designators and no voltage ratings are known for this
    revision.
  - >-
    Voltages on the four value groups shared with rev 6.x (4.7 uF, 22 uF, 47
    uF and 470 uF) are assumed to match that revision. They are not
    confirmed for rev 4.x itself.
  - >-
    The 100 uF position has no known original voltage rating. 25 V is used
    as the replacement rating, consistent with the rest of this board
    family, and original_voltage_v is deliberately omitted.
  - >-
    The nine 47 uF positions come in two physical case sizes, four of one
    and five of the other. They are recorded as one group because no
    dimensions are known; do not assume the parts are interchangeable on the
    board.
capacitors:
  - type: electrolytic-radial
    capacitance_uf: 4.7
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: panasonic-fr
    verification: derived
  - type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 25
    original_voltage_v: 16
    quantity: 7
    series: panasonic-fr
    verification: derived
  - type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 25
    original_voltage_v: 16
    quantity: 9
    series: panasonic-fr
    verification: derived
    note: >-
      Two physical case sizes on the board, four of one and five of the
      other; combined into one entry here because no dimensions are known.
  - type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
    verification: derived
    note: >-
      Present only on rev 4.x; rev 6.x has no 100 uF position. No original
      voltage rating is known; 25 V is a project-convention replacement
      rating, not a confirmed upgrade.
  - type: electrolytic-radial
    capacitance_uf: 220
    voltage_v: 25
    original_voltage_v: 16
    quantity: 5
    series: panasonic-fr
    verification: derived
  - type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 4
    series: panasonic-fr
    verification: derived
