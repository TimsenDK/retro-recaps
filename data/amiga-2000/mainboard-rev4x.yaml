id: amiga-2000-mainboard-rev4x
machine: amiga-2000
board: mainboard
revisions:
  - 4.x
verification: derived
sources:
  - url: https://www.amiga-shop.net/en/Amiga-Hardware/Amiga-classic-hardware/Amiga-2000-repair-kit::989.html
    note: >-
      Alinea/Amiga-Shop.net sells separate Rev 4 and Rev 6 kits with different
      declared contents; used here as the per-revision breakdown for rev 4.x.
      No designators or voltage ratings are given on the page.
notes:
  - >-
    DERIVED, no designator-level source found for this revision. The
    handover's original assumption ("rev 4.x = the 32-piece all-revision kit
    minus the three 4.7 uF positions, inferred by subtracting the 29-piece
    Alinea rev-4 kit from the 32-piece all-revision kit") turned out to be
    wrong: reading the Alinea rev-4 and rev-6 kit descriptions directly shows
    rev 4.x DOES include 3x 4.7 uF, same as rev 6.x. The real difference is
    that rev 4.x has 4 fewer 47 uF positions (9 vs. 13 on rev 6.x) and one
    47 uF position on rev 6.x is instead a single 100 uF position unique to
    rev 4.x. Net difference: 29 vs 32 pieces, matching both kits' stated
    totals, but for a different reason than originally assumed.
  - >-
    Quantities and capacitance values below come from the Alinea kit content
    list, which is a real vendor bill of materials, not a subtraction
    inference — but it still gives no reference designators and no voltage
    ratings, so it cannot be upgraded past "derived" without a designator- or
    photo-level source.
  - >-
    Voltage assumed to match rev 6.x on the four value groups shared between
    both revisions (4.7 uF, 22 uF, 47 uF, 470 uF), since both boards share the
    same schematic family and rev 6.x's 16 V original / 25 V replacement
    pattern is independently confirmed there. Not treated as confirmed for
    rev 4.x itself.
  - >-
    The unique 100 uF position has no original voltage given by any source
    found. 25 V is used as the replacement rating, consistent with every
    other position on this board family, but this is a project convention
    applied in the absence of data, not a confirmed original rating -
    original_voltage_v is deliberately omitted.
  - >-
    The Alinea rev-4 listing splits the 47 uF group into "4x Radial 47 uF"
    and "5x Radial 47 uF (other diameter)" - two physical case sizes. Combined
    into one 9-piece entry here since no dimensions were given for either
    group; do not assume they are interchangeable on the physical board.
capacitors:
  - type: electrolytic-radial
    capacitance_uf: 4.7
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: panasonic-fr
    verification: derived
    note: >-
      Contradicts the handover's subtraction-derived assumption that rev 4.x
      lacks the 4.7 uF positions entirely. The Alinea rev-4 kit listing
      states 3x 4.7 uF, same as rev 6.x. Needs designator-level confirmation.
  - type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 25
    original_voltage_v: 16
    quantity: 7
    series: panasonic-fr
    verification: derived
  - type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 25
    original_voltage_v: 16
    quantity: 9
    series: panasonic-fr
    verification: derived
    note: >-
      Alinea lists this as two groups of different physical diameter (4 +
      5) with no dimensions given; combined into one position here.
  - type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
    verification: derived
    note: >-
      Present only on rev 4.x per Alinea's kit listing; rev 6.x has no 100 uF
      position. No original voltage found anywhere; 25 V chosen as a project-
      convention replacement rating, not a confirmed upgrade.
  - type: electrolytic-radial
    capacitance_uf: 220
    voltage_v: 25
    original_voltage_v: 16
    quantity: 5
    series: panasonic-fr
    verification: derived
  - type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 4
    series: panasonic-fr
    verification: derived
