id: amiga-2000-psu
machine: amiga-2000
board: psu
revisions:
  - "4.4"
  - 6.x
verification: derived
sources:
  - url: https://www.arcticretro.com/amiga/amiga-2000-power-supply-capacitors/
    note: >-
      States it covers "Rev 4.4 and 6, EU/230V version" of the Amiga 2000
      PSU. Gives a full electrolytic list (retrieved in full below - the
      spreadsheet had only captured the first two rows). No X2/RIFA
      capacitors are listed on this page.
  - url: http://blog.worldofjani.com/?p=6375
    note: >-
      Independent teardown of an Amiga 2000 PSU. Disagrees with Arctic Retro
      on several electrolytic values and does confirm RIFA X2/Y film
      capacitors are present. See notes below.
  - url: https://www.eevblog.com/forum/beginners/commodore-amiga-2000-power-supply-rifa-capacitor-value/
    note: >-
      Forum post with a photo of a failed Amiga 2000 PSU capacitor
      identifying it as "RIFA PME 271 M" - confirms RIFA X2 film capacitors
      are used in this PSU, but the poster could not read the value off the
      damaged part and no one in the thread supplied one.
notes:
  - >-
    This list describes the EU/230 V supply fitted to rev 4.4 and rev 6
    machines. Amiga 2000 supplies were built by more than one vendor across
    the production run and the electrolytic values are not settled - a
    differently built unit can carry a substantially different set. Identify
    and count the supply in hand before ordering.
  - >-
    RIFA X2 mains-filter film capacitors are fitted to this supply and are
    replaced unconditionally regardless of their original rating. The exact
    capacitance and quantity are unconfirmed. Y-class capacitors are also
    present on some units; they are not tracked by this list.
capacitors:
  - type: electrolytic-snap-in
    capacitance_uf: 680
    voltage_v: 200
    quantity: 2
    series: nichicon-lgn
    note: Primary filter; 22 mm diameter, 10 mm snap-in pitch.
  - type: electrolytic-radial
    capacitance_uf: 4700
    voltage_v: 16
    quantity: 2
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 4700
    voltage_v: 10
    quantity: 3
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 1
    voltage_v: 100
    quantity: 2
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 25
    quantity: 5
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 35
    quantity: 1
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 220
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
  - type: film-x2
    capacitance_uf: 0.1
    voltage_v: 275
    quantity: 2
    series: kemet-r46
    verification: unverified
    note: >-
      RIFA X2 mains filter capacitors, replaced unconditionally regardless
      of rating. The 100 nF value and the quantity of two are unconfirmed
      for this assembly.
