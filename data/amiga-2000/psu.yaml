id: amiga-2000-psu
machine: amiga-2000
board: psu
mains: true
x2_filter: listed
revisions:
  - "4.4"
  - 6.x
verification: derived
notes:
  - >-
    This is a mains-carrying supply. The primary side holds a lethal charge
    after the machine is unplugged; discharge it before touching anything on
    that side of the transformer.
  - >-
    The electrolytic complement of this supply is not settled. Two documented
    teardowns of Amiga 2000 supplies give different figures for most
    positions - five 4700 uF outputs in one, three 3300 uF plus a 220 uF pair
    in the other. The list below is the one scoped to rev 4.4 and rev 6
    machines. Whether the difference is a production variation or a
    misreading is not established, and no Amiga 2000 supply has a
    manufacturer or model recorded anywhere retrievable, so the units cannot
    be told apart by vendor. Count and read the parts in the unit in hand
    before ordering.
  - >-
    RIFA mains-filter film capacitors are fitted to this supply, X-class
    across the line and Y-class across the isolation barrier. Both are
    replaced unconditionally regardless of their measured value or rating,
    and an X-class part is not a substitute for a Y-class one.
capacitors:
  - designators_unknown: true
    type: electrolytic-snap-in
    capacitance_uf: 680
    voltage_v: 200
    original_voltage_unknown: true
    quantity: 2
    max_diameter_mm: 22
    max_lead_spacing_mm: 10
    series: nichicon-lgn
    note: >-
      Series pair across the rectified mains bus, each holding roughly half
      of it, which is why 200 V parts are adequate where the bus peaks near
      325 V. Replace both together with identical parts. A single capacitor
      fitted in place of the pair must be rated 400 V or more. Ratings of
      200 V and 250 V are both reported for this position; the higher one is
      safe wherever it fits.
