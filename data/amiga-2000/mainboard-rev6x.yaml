id: amiga-2000-mainboard-rev6x
machine: amiga-2000
board: mainboard
revisions:
  - 6.x
verification: verified
sources:
  - url: https://support.retrorewind.ca/en/blog/amiga-2000-cap-list
    note: >-
      Full designator list, 31-32 electrolytics depending on how the two
      duplicate 22 uF rows in the published table are read (see note below).
  - url: https://hd.retrorewind.ca/commodore/amiga/a2000caplist
    note: Same list on Retro Rewind's wiki, cross-checked against the blog post.
  - url: https://retrofix.co.uk/pdf/A2000.pdf
    note: >-
      Independent BOM/kit vendor (Retrofix, UK), designator-for-designator
      match on all five electrolytic value groups: 3x 4.7 uF, 7x 22 uF, 13x
      47 uF, 5x 220 uF, 4x 470 uF (32 total). Used as the primary designator
      source since it lists all designators explicitly and matches
      Retro Rewind's list exactly.
notes:
  - >-
    The Retro Rewind blog table prints "7" as the quantity for the 22 uF
    group but lists 7 designators (C233, C243, C317, C318, C701, C813, C814);
    the Retrofix BOM independently confirms 7x 22 uF with the same
    designators, so 7 is used here.
  - >-
    A vendor (Alinea/amiga-shop.net) kit listing for this revision also
    describes 4 of the 5x 220 uF positions as axial rather than radial.
    Retrofix's BOM lists all 5 as a single "Electrolytic Capacitor" group with
    no axial/radial split, and no other source corroborates an axial
    footprint at C416-C419. Not applied here for lack of a second source;
    flagged for anyone re-checking this board against physical photos.
  - >-
    Original voltage on all positions was 16 V per Retro Rewind; replacement
    voltage upgraded to 25 V per project convention.
capacitors:
  - designators:
      - C224
      - C415
      - C811
    type: electrolytic-radial
    capacitance_uf: 4.7
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: panasonic-fr
  - designators:
      - C233
      - C243
      - C317
      - C318
      - C701
      - C813
      - C814
    type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 25
    original_voltage_v: 16
    quantity: 7
    series: panasonic-fr
  - designators:
      - C222
      - C223
      - C402
      - C403
      - C404
      - C405
      - C406
      - C408
      - C410
      - C412
      - C420
      - C421
      - C422
    type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 25
    original_voltage_v: 16
    quantity: 13
    series: panasonic-fr
  - designators:
      - C400
      - C416
      - C417
      - C418
      - C419
    type: electrolytic-radial
    capacitance_uf: 220
    voltage_v: 25
    original_voltage_v: 16
    quantity: 5
    series: panasonic-fr
    note: >-
      A vendor kit listing describes 4 of these 5 as axial; not corroborated
      elsewhere, so recorded here as radial per Retrofix's BOM and Retro
      Rewind. Verify footprint against the physical board before ordering
      in bulk.
  - designators:
      - C214
      - C225
      - C226
      - C912
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 4
    series: panasonic-fr
