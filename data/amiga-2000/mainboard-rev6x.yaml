id: amiga-2000-mainboard-rev6x
machine: amiga-2000
board: mainboard
revisions:
  - 6.x
verification: verified
sources:
  - url: https://support.retrorewind.ca/en/blog/amiga-2000-cap-list
    note: >-
      Full designator list, 31-32 electrolytics depending on how the two
      duplicate 22 uF rows in the published table are read (see note below).
  - url: https://hd.retrorewind.ca/commodore/amiga/a2000caplist
    note: Same list on Retro Rewind's wiki, cross-checked against the blog post.
  - url: https://retrofix.co.uk/pdf/A2000.pdf
    note: >-
      Independent BOM/kit vendor (Retrofix, UK), designator-for-designator
      match on all five electrolytic value groups: 3x 4.7 uF, 7x 22 uF, 13x
      47 uF, 5x 220 uF, 4x 470 uF (32 total). Used as the primary designator
      source since it lists all designators explicitly and matches
      Retro Rewind's list exactly.
notes:
  - >-
    C416-C419 are recorded as radial. An axial footprint is reported for
    these four positions but is not corroborated; check the footprint
    against the physical board before ordering in bulk.
  - >-
    Every position was originally 16 V; replacements are upgraded to 25 V
    per project convention.
capacitors:
  - designators:
      - C224
      - C415
      - C811
    type: electrolytic-radial
    capacitance_uf: 4.7
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: panasonic-fr
