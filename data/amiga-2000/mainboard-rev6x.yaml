id: amiga-2000-mainboard-rev6x
machine: amiga-2000
board: mainboard
revisions:
  - 6.x
verification: derived
battery: true
sources:
  - url: https://support.retrorewind.ca/en/blog/amiga-2000-cap-list
    note: >-
      The only retrievable designator-level list for an Amiga 2000
      mainboard: 32 electrolytics in five value groups. The page names no
      motherboard revision.
  - url: https://hd.retrorewind.ca/commodore/amiga/a2000caplist
    note: >-
      The same list on the same vendor's wiki. Not an independent
      confirmation of it.
  - url: https://www.amiga-shop.net/en/Amiga-Hardware/Amiga-classic-hardware/Amiga-2000-repair-kit::989.html
    note: >-
      Kit vendor selling separate Rev 4 and Rev 6 kits. The declared Rev 6
      contents match this complement exactly - 3x 4.7 uF, 7x 22 uF, 13x
      47 uF, 5x 220 uF (one radial, four axial), 4x 470 uF - which is what
      ties the complement to rev 6.x. No designators or voltages are given.
notes:
  - >-
    A NiCd barrel battery for the real-time clock is soldered to this board.
    It leaks and corrodes the traces around it; remove it before doing
    anything else, and inspect that area for damage.
  - >-
    The 32-position complement below is what a rev 6 board carries. The
    assignment of those positions to these particular reference designators
    rests on a single published list, which names no revision at all, so the
    designators are not independently confirmed for rev 6.x. Check them
    against the board.
  - >-
    C416-C419 are recorded as radial here, but an axial footprint is also
    reported for those four positions. Check the footprint on the board
    before ordering in bulk.
  - >-
    Every position was originally 16 V; replacements are upgraded to 25 V
    per project convention.
capacitors:
  - designators:
      - C224
      - C415
      - C811
    type: electrolytic-radial
    capacitance_uf: 4.7
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: panasonic-fr
  - designators:
      - C233
      - C243
      - C317
      - C318
      - C701
      - C813
      - C814
    type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 25
    original_voltage_v: 16
    quantity: 7
    series: panasonic-fr
  - designators:
      - C222
      - C223
      - C402
      - C403
      - C404
      - C405
      - C406
      - C408
      - C410
      - C412
      - C420
      - C421
      - C422
    type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 25
    original_voltage_v: 16
    quantity: 13
    series: panasonic-fr
  - designators:
      - C400
      - C416
      - C417
      - C418
      - C419
    type: electrolytic-radial
    capacitance_uf: 220
    voltage_v: 25
    original_voltage_v: 16
    quantity: 5
    series: panasonic-fr
    note: >-
      C416-C419 are reported both as radial and as axial; they are recorded
      here as radial. C400 is radial. Verify the footprint against the
      physical board before ordering in bulk.
  - designators:
      - C214
      - C225
      - C226
      - C912
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 4
    series: panasonic-fr
