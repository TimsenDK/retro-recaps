id: commodore-128
name: Commodore 128
family: commodore-8bit
released: '1985-01'
about: >-
    The last 8-bit home computer Commodore released, carrying two processors —
    an 8502 and a Z80 — and 128 KB of RAM. It runs nearly all Commodore 64
    software, drives an 80-column display of its own, and boots CP/M.
wikipedia: https://en.wikipedia.org/wiki/Commodore_128
aliases:
  - C128
  - C-128
  - Commodore 128
board_order:
  - mainboard
  - psu
notes:
  - >-
    Mainboard ASSY 310379 is documented as two files, rev 6 and rev 7. The
    revisions differ at two positions, C63 and C69, not only at the commonly
    cited C63. See mainboard-rev6.yaml and mainboard-rev7.yaml.
  - >-
    Three different external supplies shipped with this machine, built by
    Mitsumi, Ismet and Dee Van. They look alike from the outside but carry
    different capacitor complements and different designator schemes - from
    two electrolytics to five or six. Open the case and read the board
    before ordering parts, and do not apply one unit's list to another.
  - >-
    The external part numbers 310416-01 through -05 and the internal board
    numbers 252449-01 and 252449-03 both appear on these supplies, but which
    external number goes with which builder's board is not established.
