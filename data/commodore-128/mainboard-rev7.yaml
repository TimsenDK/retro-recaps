id: commodore-128-mainboard-rev7
machine: commodore-128
board: mainboard
revisions:
  - 310379 rev 7
  - 310381 rev 7
verification: verified
notes:
  - >-
    Differs from rev 6 (mainboard-rev6.yaml) at two positions: C63 is 100 uF
    6.3 V here instead of 10 uF 16 V, and C69 is not populated at all on
    this revision. All other positions are identical to rev 6.
  - >-
    C104 and C105 are rated 50 V from the factory but sit on rails that
    measure roughly 11 V and 21 V in circuit, so the original parts are
    physically larger than the job requires.
  - >-
    C101 is 10 uF but was rated 35 V from the factory, unlike the other
    10 uF positions, which were 16 V.
