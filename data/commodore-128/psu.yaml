verification: unverified
sources:
  - url: https://www.lemon64.com/forum/viewtopic.php?t=58011
    note: >-
      Background reading only, not treated as confirmed. One user reports
      2200 uF 40 V and 4700 uF 16 V inside their unit.
  - url: https://hobbytronics.home.blog/2019/02/23/commodore-128-power-supply-recap/
    note: >-
      Background reading only. Confirms "only two capacitors in this model
      of supply" (a Mitsumi 252449-01 board labelled 310416-05) but gives no
      values or voltages.
notes:
  - >-
    At least two supply designs exist: an Ismet board carrying two
    capacitors, and a Mitsumi board reported to carry up to five. Reported
    values are inconsistent between them, including for designators C4 and
    C7, which may not be the same positions on both designs.
  - >-
    No capacitor list is confirmed for either design. Count and measure the
    supply in hand before recapping.
