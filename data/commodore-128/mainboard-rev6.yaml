id: commodore-128-mainboard-rev6
machine: commodore-128
board: mainboard
revisions:
  - 310379 rev 6
verification: verified
sources:
  - url: https://support.retrorewind.ca/en/blog/c128-assembly-310379
    note: Kit list with designators for both rev 6 and rev 7, cross-checked below.
  - url: https://www.lemon64.com/forum/viewtopic.php?t=59823
    note: >-
      Independent forum thread "Electrolytic caps in the 64/128" giving the
      same per-designator values, including confirming C101 is 10 uF 35 V
      (not part of the 16 V batch) and that C63/C69 are what differs on rev 7.
  - url: https://hd.retrorewind.ca/commodore/c128/assy-310379
    note: Confirms ASSY 310379 is used by C128 and C128D, not the C128DCR.
  - url: https://wiki.console5.com/wiki/Commodore_128
    note: >-
      Third independent designator-level list, headed "310379 Rev. 6",
      matching all 15 positions and their factory voltages. Annotates C104
      and C105 as "50v highly overrated: in-circuit measures ~11v" and
      "~21v".
notes:
  - >-
    Rev 7 of this board differs at two positions, not only at C63: C63
    becomes 100 uF 6.3 V (10 uF 16 V here), and C69 is not populated at all
    on rev 7. Rev 6 is therefore not simply a superset of rev 7, which is
    why the two revisions are separate files.
  - >-
    C101 is 10 uF but was rated 35 V from the factory, unlike the other
    10 uF positions, which were 16 V.
  - >-
    C104 and C105 are rated 50 V from the factory but sit on rails that
    measure roughly 11 V and 21 V in circuit, so the original parts are
    physically larger than the job requires.
