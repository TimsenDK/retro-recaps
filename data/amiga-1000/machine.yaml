id: amiga-1000
name: Commodore Amiga 1000
family: amiga
aliases:
  - A1000
board_order:
  - mainboard
  - daughterboard
  - psu
notes:
  - >-
    Two regional variants exist and are documented as separate boards -
    NTSC/110V (Rev A mainboard, with a separate WCS daughterboard) and
    PAL/240V (WCS integrated onto the mainboard, no separate daughterboard).
    Use the matching *-ntsc.yaml or *-pal.yaml files only; do not mix
    designators or capacitor values across variants.
  - >-
    The PAL mainboard's capacitor values are known but its reference
    designators are not; see mainboard-pal.yaml.
  - >-
    The PSU differs between the NTSC/110V and PAL/240V units, most notably
    in the primary-side bulk capacitor; see psu-ntsc.yaml and psu-pal.yaml.
