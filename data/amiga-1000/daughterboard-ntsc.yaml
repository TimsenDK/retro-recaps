id: amiga-1000-daughterboard-ntsc
machine: amiga-1000
board: daughterboard
revisions:
  - NTSC
verification: verified
notes:
  - >-
    WCS (Writable Control Store) piggyback daughterboard, fitted to the NTSC
    mainboard. Its presence is the visible sign that a machine has an NTSC
    board, whatever region it was sold in; on a true PAL mainboard the WCS
    is on the mainboard and there is no daughterboard - see
    mainboard-pal.yaml.
capacitors:
  - designators:
      - C10
      - C11
    type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    original_voltage_v: 16
    quantity: 2
    series: panasonic-fr
