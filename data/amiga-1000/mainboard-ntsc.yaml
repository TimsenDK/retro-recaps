id: amiga-1000-mainboard-ntsc
machine: amiga-1000
board: mainboard
revisions:
  - NTSC
verification: verified
sources:
  - url: https://support.retrorewind.ca/en/blog/amiga-1000-cap-list
    note: >-
      Mainboard and WCS daughterboard designator list. Carries neither C92
      nor C94, and states no revision or region.
  - url: https://www.tsb.space/knowledge-base/commodore-amiga-capacitor-lists/
    note: >-
      Independent confirmation of the same designators and values, and the
      only retrieved list carrying C92 and recording C94 as empty. States no
      revision or region.
notes:
  - >-
    This is the list for the board that carries the WCS on a piggyback
    daughterboard - the NTSC build, including the early European machines
    fitted with a PAL Agnus and a 240 V supply. Those machines need this
    list and the daughterboard list, not the PAL mainboard list.
  - C94 is an unpopulated position on this board; no capacitor is fitted there.
  - >-
    C92 is not fitted on every mainboard. Which boards carry it is not
    established, so count the position on the board rather than assuming the
    total.
  - >-
    No published list states which mainboard revision it describes, so the
    designators here are scoped to the NTSC build and not to a revision
    within it.
capacitors:
  - designators:
      - C48
      - C49
      - C50
      - C63
      - C64
      - C65
      - C66
    type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 25
    original_voltage_v: 16
    quantity: 7
    series: panasonic-fr
  - designators:
      - C92
    type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
    verification: derived
    note: Not fitted on every mainboard; check the position on the board.
  - designators:
      - C78
      - C79
      - C80
      - C175
    type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    original_voltage_v: 16
    quantity: 4
    series: panasonic-fr
  - designators:
      - C93
    type: electrolytic-radial
    capacitance_uf: 220
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
  - designators:
      - C95
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
