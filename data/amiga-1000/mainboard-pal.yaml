id: amiga-1000-mainboard-pal
machine: amiga-1000
board: mainboard
revisions:
  - PAL
verification: derived
notes:
  - >-
    PAL boards integrate the WCS onto the mainboard, so this list folds in
    the two 100 uF WCS positions that are a separate daughterboard on NTSC.
  - >-
    Reference designators for the PAL board are not known; only quantities
    and values. Check counts against the physical board.
capacitors:
  - designators_unknown: true
    type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 25
    original_voltage_v: 16
    quantity: 7
    series: panasonic-fr
    verification: derived
  - designators_unknown: true
    type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
    verification: derived
    note: Not fitted on every mainboard; check the position on the board.
  - designators_unknown: true
    type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    original_voltage_v: 16
    quantity: 6
    series: panasonic-fr
    verification: derived
    note: Includes the two positions that are on a separate WCS daughterboard on NTSC boards.
  - designators_unknown: true
    type: electrolytic-radial
    capacitance_uf: 220
    voltage_v: 25
    original_voltage_v: 16
    quantity: 2
    series: panasonic-fr
    verification: derived
    note: One extra 220 uF position compared with the NTSC board.
  - designators_unknown: true
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
    verification: derived
