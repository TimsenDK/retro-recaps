id: amiga-1000-psu-pal
machine: amiga-1000
board: psu
mains: true
x2_filter: unknown
revisions:
  - PAL / 240V
verification: verified
sources:
  - url: https://funwithretrocomputers.blogspot.com/2019/09/amiga-1000-psu-recap.html
    note: Shindengen CA1000PS/EC (PAL/240V) teardown with full reference designators.
  - url: https://jbretro.wordpress.com/2020/04/15/ca1000ps/
    note: Independent confirmation of the same PAL/240V board and values. Its table omits C04; otherwise matches exactly.
notes:
  - >-
    This is a mains-carrying supply. The primary side holds a lethal charge
    after the machine is unplugged; discharge it before touching anything on
    that side of the transformer.
  - >-
    Whether this supply has a mains-side X2 or Y film capacitor is not
    established; the list below does not inventory the input filter. Inspect
    the mains input, and replace any RIFA-marked film found there
    unconditionally, regardless of its rating.
  - >-
    This list describes the Shindengen CA1000PS/EC. A Viking 130569SXD unit
    was also fitted to some machines; it is a different supply and this list
    does not describe it.
capacitors:
  - designators:
      - C04
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 35
    original_voltage_unknown: true
    quantity: 1
    series: panasonic-fr
    verification: derived
    note: >-
      Not fitted on every unit. Where it is present the equivalent position
      on the 110 V supply is 10 uF 35 V.
  - designators:
      - C09
    type: electrolytic-radial
    capacitance_uf: 4.7
    voltage_v: 50
    original_voltage_unknown: true
    quantity: 1
    series: panasonic-fr
  - designators:
      - C10
    type: electrolytic-radial
    capacitance_uf: 1
    voltage_v: 50
    original_voltage_unknown: true
    quantity: 1
    series: panasonic-fr
  - designators:
      - C11
      - C12
      - C13
    type: electrolytic-radial
    capacitance_uf: 2200
    voltage_v: 10
    original_voltage_unknown: true
    quantity: 3
    series: panasonic-fr
  - designators:
      - C15
      - C17
      - C19
    type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    original_voltage_unknown: true
    quantity: 3
    series: panasonic-fr
  - designators:
      - C16
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 35
    original_voltage_unknown: true
    quantity: 1
    series: panasonic-fr
  - designators:
      - C18
    type: electrolytic-radial
    capacitance_uf: 330
    voltage_v: 25
    original_voltage_unknown: true
    quantity: 1
    series: panasonic-fr
  - designators:
      - C50
    type: electrolytic-snap-in
    capacitance_uf: 180
    voltage_v: 400
    original_voltage_unknown: true
    quantity: 1
    series: nichicon-lgn
    note: >-
      Primary-side bulk capacitor, on the mains side of the transformer, for
      the 240 V input. Do not substitute the 470 uF/200 V part from
      psu-ntsc.yaml here - it is not rated for this bus.
