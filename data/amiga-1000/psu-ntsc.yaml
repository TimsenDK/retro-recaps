id: amiga-1000-psu-ntsc
machine: amiga-1000
board: psu
revisions:
  - NTSC / 110V
verification: derived
sources:
  - url: https://blog.worldofjani.com/?p=6238
    note: NTSC/110V Amiga 1000 PSU teardown and capacitor list with dimensions, no reference designators.
  - url: https://funwithretrocomputers.blogspot.com/2019/09/amiga-1000-psu-recap.html
    note: Sibling PAL/240V board with designators, used to cross-check the shared secondary-side values (all match except the primary bulk capacitor, which differs by mains voltage as expected).
notes:
  - The spreadsheet listed this PSU as 2x 1000 uF/25V, 2x 2200 uF/25V and 2x 220 uF/200V snap-in, marked "typical, not verified." None of that matches the independently sourced values below. The worldofjani teardown is treated as the better-evidenced source, per the migration brief's rule for disagreeing sources.
  - No mains-side X2/RIFA film capacitor was found on any source checked for this PSU (worldofjani, funwithretrocomputers, jbretro.wordpress.com, an oldcrap.org schematic listing, and a LinuxJedi restoration post where a commenter's RIFA question about a different capacitor, C42, was dismissed by the author). The spreadsheet's assumption of an unconditional RIFA/X2 replacement could not be confirmed for this PSU and has been omitted rather than invented.
  - No reference designators are published for the NTSC/110V unit. Values are cross-checked against the designated PAL/240V sibling board (see psu-pal.yaml); every secondary-side value matches exactly, only the primary bulk capacitor differs.
