id: amiga-1000-psu-ntsc
machine: amiga-1000
board: psu
revisions:
  - NTSC / 110V
verification: derived
sources:
  - url: https://blog.worldofjani.com/?p=6238
    note: NTSC/110V Amiga 1000 PSU teardown and capacitor list with dimensions, no reference designators.
  - url: https://funwithretrocomputers.blogspot.com/2019/09/amiga-1000-psu-recap.html
    note: Sibling PAL/240V board with designators, used to cross-check the shared secondary-side values (all match except the primary bulk capacitor, which differs by mains voltage as expected).
notes:
  - >-
    No mains-side X2/RIFA film capacitor position is known on this supply.
    Inspect the unit before assuming one is present to replace.
  - >-
    No reference designators are known for the NTSC/110V unit. Every
    secondary-side value matches the PAL/240V sibling board (psu-pal.yaml);
    only the primary bulk capacitor differs.
capacitors:
  - type: electrolytic-radial
    capacitance_uf: 1
    voltage_v: 50
    quantity: 1
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 4.7
    voltage_v: 50
    quantity: 1
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 35
    quantity: 1
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    quantity: 3
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 330
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 35
    quantity: 1
    series: panasonic-fr
  - type: electrolytic-radial
    capacitance_uf: 2200
    voltage_v: 10
    quantity: 3
    series: panasonic-fr
  - type: electrolytic-snap-in
    capacitance_uf: 470
    voltage_v: 200
    quantity: 1
    series: nichicon-lgn
    note: >-
      Primary-side bulk/filter capacitor, approx. 30 x 35 mm.
      NTSC/110V-specific value; do not substitute the PAL 180 uF/400V part
      from psu-pal.yaml.
