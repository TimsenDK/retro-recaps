id: mac-se
name: Macintosh SE
family: macintosh
board_order:
  - analog
  - psu
notes:
  - >-
    The logic board is reported to need no recap: its ten 33 uF/16 V
    positions (C4, C11, C13, C16, C32, C34, C37, C38, C62, C86) and its
    axial 1 uF C36 are said to survive where other compact-Mac boards do
    not. That claim is unconfirmed - inspect the board rather than skip it
    on the strength of it. No logic board file is tracked for this machine.
  - >-
    The SE shipped with either a Sony CR-44 or an Astec AA13800 power
    supply; their capacitor sets differ and are tracked as separate PSU
    files. Verify which manufacturer is fitted before ordering parts.
  - >-
    The analog board list here is known incomplete - see the analog board's
    own notes.
batteries:
  - kind: pram
    action: replace
    note: 1/2 AA PRAM battery.
