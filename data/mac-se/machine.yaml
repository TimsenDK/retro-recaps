board_order:
  - logic
  - analog
  - psu
notes:
  - >-
    Three power supply builds are documented for this machine - Sony CR-44M,
    Astec AA13800 and Apple 820-0385-A (Hitachi). Their capacitor sets are
    entirely different and are tracked as separate files. Apple part number
    699-5047 appears on more than one of them, so read the label on the
    module rather than the Apple number.
  - >-
    The logic board carries through-hole axial electrolytics rather than the
    surface-mount parts that fail on the SE/30 and Classic II, which is why
    it is widely said to need no recap. Inspect and measure it rather than
    skip it on the strength of that claim.
  - >-
    Designators repeat across the boards with different values. C11 and C13
    are on both the logic and the analog board; C32 and C36 are on both the
    logic board and the Astec supply; C7, C19 and C24 are on both the analog
    board and the Astec supply. Never carry a designator between boards.
batteries:
  - kind: pram
    action: replace
    note: 1/2 AA PRAM battery.
