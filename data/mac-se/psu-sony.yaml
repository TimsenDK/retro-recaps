id: mac-se-psu-sony
machine: mac-se
board: psu
mains: true
x2_filter: listed
revisions:
  - Sony CR-44M
verification: derived
notes:
  - >-
    Off-line switching supply. C162 sits on the rectified mains bus at
    400 V and holds a lethal charge after the machine is unplugged;
    discharge it before working on the board.
  - >-
    The designators on this supply run in the C1xx and C2xx ranges and do
    not collide with any other board in the machine.
  - >-
    The Macintosh SE also shipped with an Astec AA13800 or an Apple
    820-0385-A (Hitachi) supply, tracked separately. Their capacitor sets
    are entirely different.
capacitors:
  - designators: [C162]
    type: electrolytic-snap-in
    capacitance_uf: 620
    voltage_v: 400
    original_voltage_v: 400
    quantity: 1
    series: nichicon-lgn
    note: >-
      Primary bulk reservoir on the rectified mains bus. Snap-in terminals
      do not fit a radial-leaded footprint.
  - designators: [C164, C165]
    type: electrolytic-radial
    capacitance_uf: 4.7
    voltage_v: 350
    original_voltage_v: 350
    quantity: 2
    series: nichicon-ucy
    note: Primary-side positions; both are rated well above any logic rail.
  - designators: [C168]
    type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
  - designators: [C257]
    type: electrolytic-radial
    capacitance_uf: 4700
    voltage_v: 16
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
    note: >-
      Large reservoir can. The factory rating is kept because a
      higher-voltage part in this capacitance does not fit the original
      footprint.
  - designators: [C258]
    type: electrolytic-radial
    capacitance_uf: 6800
    voltage_v: 10
    original_voltage_v: 10
    quantity: 1
    series: panasonic-fr
    note: >-
      Largest can in the supply, on the 5 V rail. The factory rating is kept
      because a higher-voltage part in this capacitance does not fit the
      original footprint.
  - designators: [C259, C264, C279]
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: panasonic-fr
  - designators: [C261, C263, C266]
    type: electrolytic-radial
    capacitance_uf: 2200
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: panasonic-fr
  - designators: [C262]
    type: electrolytic-radial
    capacitance_uf: 3300
    voltage_v: 10
    original_voltage_v: 10
    quantity: 1
    series: panasonic-fr
    note: >-
      Large reservoir can. The factory rating is kept because a
      higher-voltage part in this capacitance does not fit the original
      footprint.
  - designators: [C265, C270, C275, C276]
    type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 25
    original_voltage_v: 25
    quantity: 4
    series: panasonic-fr
  - designators: [C269]
    type: electrolytic-radial
    capacitance_uf: 1
    voltage_v: 50
    original_voltage_v: 50
    quantity: 1
    series: panasonic-fr
  - designators_unknown: true
    type: film-y2
    capacitance_uf: 0.0047
    voltage_v: 300
    original_voltage_unknown: true
    quantity: 3
    series: tdk-b32021
    note: >-
      Metallized-paper RIFA safety capacitors of 4700 pF on the mains input.
      Not fitted to every supply; where they are, there are three. They
      crack, absorb moisture and fail explosively, so they are replaced
      unconditionally when found. The factory AC rating is not recorded
      anywhere retrievable; 300 VAC is the rating of the replacement class.
