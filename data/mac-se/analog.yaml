id: mac-se-analog
machine: mac-se
board: analog
revisions:
  - all known
verification: derived
notes:
  - >-
    This list is incomplete. Only four positions are recorded; the board
    carries several additional small capacitors that are not documented
    here.
  - >-
    C15's original rating is documented inconsistently: as a 3.9 uF 35 V
    bipolar electrolytic, and as a 3.9 uF 250-450 VDC part, which would make
    it a film capacitor rather than a bipolar electrolytic. The replacement
    recorded here is a 3.9 uF 50 V bipolar.
  - >-
    This analog board design is shared with the Macintosh SE/30, whose copy
    of it is tracked under that machine.
capacitors:
  - designators: [C15]
    type: bipolar
    capacitance_uf: 3.9
    voltage_v: 50
    original_voltage_v: 35
    quantity: 1
    series: nichicon-ues
    verification: derived
    note: >-
      Non-polarised. Known failure point causing horizontal collapse. The
      original rating is documented inconsistently - see board notes.
  - designators: [C11]
    type: electrolytic-axial
    capacitance_uf: 33
    voltage_v: 25
    quantity: 1
    series: vishay-021-asm
    verification: derived
    note: >-
      Analog board position - do not confuse with the C11 positions on the
      logic board or in the PSU, which are different components.
  - designators: [C18]
    type: electrolytic-axial
    capacitance_uf: 22
    voltage_v: 50
    quantity: 1
    series: vishay-021-asm
  - designators: [C19]
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 160
    quantity: 1
    series: panasonic-fr
    verification: derived
    note: >-
      Analog board position - do not confuse with the C19 position in the
      Sony PSU, which is a different component (220 uF/25 V).
