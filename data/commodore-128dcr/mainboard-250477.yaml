verification: verified
notes:
  - >-
    This is the metal-case C128DCR mainboard. Its designator scheme overlaps
    the flat C128's ASSY 310379 numbering but the values behind those
    numbers differ - C69, C85 and C92 are 25 V here against 16 V on 310379,
    C88 is a 1000 uF axial that 310379 does not have, and C35, C100, C109,
    C115, C140 and C141 do not exist on 310379 at all. Do not carry a C128
    list over to this board.
  - >-
    C140 and C141 are non-polarised (bipolar) parts, marked NP on the board.
    A polarised electrolytic must not be fitted in either position.
  - >-
    C88 and C100 are axial cans; the remaining positions are radial.
