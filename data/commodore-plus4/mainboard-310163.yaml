id: commodore-plus4-mainboard-310163
machine: commodore-plus4
board: mainboard
revisions:
  - ASSY 310163-01
verification: verified
sources:
  - url: https://support.retrorewind.ca/en/blog/plus-4-assembly-310163-01
    note: >-
      Full designator/value/voltage list, 10 positions: C1 100uF 16V, C7
      2200uF 16V axial, C8/C17/C18/C20/C22/C27/C30 10uF 16V (x7), C23 1uF
      16V.
  - url: https://blog.worldofjani.com/?p=7015
    note: >-
      Independent list; agrees on all 10 designators and quantities, and on
      C7 (2200uF 16V axial), but rates the other nine positions at 50V
      instead of 16V.
notes:
  - >-
    worldofjani.com rates C1, C8, C17, C18, C20, C22, C23, C27 and C30 at
    50V; retrorewind.ca (used here) rates the same nine positions at 16V.
    Both sources fully agree on designators, quantities, capacitance values
    and on the C7 position. retrorewind.ca is used as the better-evidenced
    figure (matches the as-populated 16V rail these boards run on); the
    disagreement is recorded rather than silently resolved.
  - >-
    console5.com's kit listing (title only, page itself blocked by a 403 on
    fetch) suggests ASSY 250455 and 310164 share this cap set; not
    independently confirmed here.
capacitors:
  - designators:
      - C1
    type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 16
    quantity: 1
    series: panasonic-fr
    note: worldofjani.com gives this position as 100uF 50V, not 16V.
  - designators:
      - C7
    type: electrolytic-axial
    capacitance_uf: 2200
    voltage_v: 16
    quantity: 1
    series: vishay-021-asm
  - designators:
      - C8
      - C17
      - C18
      - C20
      - C22
      - C27
      - C30
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 16
    quantity: 7
    series: panasonic-fr
    note: worldofjani.com gives these positions as 10uF 50V, not 16V.
  - designators:
      - C23
    type: electrolytic-radial
    capacitance_uf: 1
    voltage_v: 16
    quantity: 1
    series: panasonic-fr
    note: worldofjani.com gives this position as 1uF 50V, not 16V.
