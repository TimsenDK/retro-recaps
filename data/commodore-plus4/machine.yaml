id: commodore-plus4
name: Commodore Plus/4
family: commodore-8bit
aliases:
  - Plus/4
  - Plus 4
board_order:
  - mainboard
notes:
  - >-
    Only board revision ASSY 310163-01 is documented here. ASSY 250455 and
    310164 are reported to share the same capacitor set, but that is
    unconfirmed; treat other revisions as unverified.
  - >-
    Uses an external PSU brick, which has the same over-voltage "brick of
    death" failure mode as the well-known C64 supply. It is treated as
    replaced whole rather than recapped, by analogy with the C64 brick,
    which is confirmed to be epoxy-potted around an internal 7805; whether
    the Plus/4 unit is potted is not confirmed. No PSU board file is
    provided either way.
