notes:
  - >-
    Only board revision ASSY 310163-01 is documented here. 310164 is that
    board's schematic drawing number, not a second revision.
  - >-
    ASSY 250455 is a genuinely different earlier board - it carries four
    diodes, CR21 to CR24, that 310163-01 does not, and the factory service
    manual covers only 310163. Whether its capacitor complement matches
    310163-01 is not established, so no list is published for it here.
  - >-
    Uses an external PSU brick, which has the same over-voltage "brick of
    death" failure mode as the well-known C64 supply. It is treated as
    replaced whole rather than recapped, by analogy with the C64 brick,
    which is confirmed to be epoxy-potted around an internal 7805; whether
    the Plus/4 unit is potted is not confirmed. No PSU board file is
    provided either way.
