notes:
  - >-
    Absent from the original BOM handover; researched from scratch with no
    spreadsheet input. Only board revision ASSY 250443-01 is confirmed by an
    opened source; other C16 board revisions are unconfirmed.
  - >-
    Uses an external PSU brick, presumed the same TED-family design as the
    Plus/4's (see commodore-plus4/machine.yaml). No source opened here
    addresses the C16 brick specifically; treating it as non-recappable and
    replaced as a whole unit is derived by analogy, not independently
    verified. No PSU board file is provided either way.
