id: commodore-16
name: Commodore 16
family: commodore-8bit
released: '1984'
about: >-
    An entry-level machine meant to replace the VIC-20, with 16 KB of RAM and
    a TED chip offering 121 colours. It shares nothing with the Commodore 64's
    software library, which is much of why it failed in the United States
    while selling modestly in Europe.
wikipedia: https://en.wikipedia.org/wiki/Commodore_16
aliases:
  - C16
  - C-16
  - Commodore 16
board_order:
  - mainboard
notes:
  - >-
    One mainboard is documented here, ASSY 250443-01. It ships in two
    stuffings: with C1 fitted, nine electrolytics, and without it, eight.
    The other eight positions are identical either way.
  - >-
    The C116 is a different assembly with its own board and is not covered
    here.
  - >-
    Uses an external PSU brick, presumed to be the same TED-family design as
    the Plus/4's (see commodore-plus4/machine.yaml). It is treated as
    replaced whole rather than recapped, by analogy with that unit; this is
    not confirmed for the C16 brick specifically. No PSU board file is
    provided either way.
