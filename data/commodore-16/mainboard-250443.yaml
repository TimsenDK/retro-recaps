id: commodore-16-mainboard-250443
machine: commodore-16
board: mainboard
revisions:
  - ASSY 250443-01
verification: verified
sources:
  - url: https://hd.retrorewind.ca/commodore/c16/assy-250443-01
    note: >-
      Full designator/value/voltage list, 9 positions: C1 1uF 25V, C2 47uF
      25V, C3/C4/C16/C18/C19/C31 10uF 25V (x6), C17 1uF 16V.
  - url: http://blog.worldofjani.com/?p=6705
    note: >-
      Independent list; agrees on designators/values/quantities for
      C3/C4/C16/C18/C19/C31 (10uF) but does not list a C1 position, and
      gives C2 as 47uF 16V and C17 as 1uF 50V.
notes:
  - >-
    Two positions carry conflicting documented voltage ratings: C2 is given
    as both 16 V and 25 V, and C17 as both 16 V and 50 V. This file uses 25
    V for C2 and 16 V for C17.
  - >-
    C1 is absent from some capacitor lists for this board. It is included
    here, giving a nine-position list.
capacitors:
  - designators:
      - C1
    type: electrolytic-radial
    capacitance_uf: 1
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
    note: Absent from some capacitor lists for this board.
  - designators:
      - C2
    type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
    note: Also documented as 47 uF 16 V.
  - designators:
      - C3
      - C4
      - C16
      - C18
      - C19
      - C31
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 25
    quantity: 6
    series: panasonic-fr
  - designators:
      - C17
    type: electrolytic-radial
    capacitance_uf: 1
    voltage_v: 16
    quantity: 1
    series: panasonic-fr
    note: Also documented as 1 uF 50 V.
