id: mac-classic-ii-logic-revb
machine: mac-classic-ii
board: logic
revisions:
  - B
verification: derived
battery: true
sources:
  - url: https://wiki.console5.com/wiki/Macintosh_Classic_II
    note: >-
      Designator-level table for the Classic II logic board, covering
      630-0055-B / 820-0326-B and 630-0401-B / 820-0401-B, and marking C21,
      C74, C79 and C106 as appearing only on the 630-0055 revision.
  - url: https://recapamac.com.au/macintosh-classic-ii-b/
    note: >-
      Names this board the later revision and gives the visual
      discriminator - 17 surface-mount electrolytics and two ROM chips in
      the bottom right corner.
  - url: https://wiki.retrotechcollection.com/Macintosh_Classic_II_Capacitor_Replacement_Guide
    note: Confirms the 17-position complement, 3 x 47 uF, 12 x 10 uF, 2 x 1 uF.
  - url: https://www.macdat.net/repair/cap_reference/apple/compact/classic2.php
    note: >-
      Confirms the same 13-position versus 17-position split and per-value
      counts, and states the 47 uF positions must be 25 V rated if replaced
      with tantalum.
notes:
  - >-
    This is the 17-position board. Count the ROM chips in the bottom right
    corner to tell the two boards apart: two ROM chips go with 17
    capacitors, four ROM chips with 13.
  - >-
    Which Apple part number this board carries is an open question. Its four
    extra positions - C21, C74, C79 and C106 - are documented as belonging to
    the 630-0055 assembly, which is the lower and therefore earlier part
    number, while this 17-position board is described elsewhere as the later
    of the two. The two accounts cannot both be right. The capacitor
    complement and the ROM count are settled; the part number is not.
  - >-
    Surface mount throughout. This project prefers tantalum over wet
    electrolytic for these positions.
  - Recap logic board before analog board.
capacitors:
  - designators: [C3, C4, C13]
    type: tantalum
    capacitance_uf: 47
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: kemet-t491
    note: These positions must be 25 V rated when replaced with tantalum.
  - designators: [C5, C6, C7, C8, C10, C11, C12, C14, C21, C74, C79, C106]
    type: tantalum
    capacitance_uf: 10
    voltage_v: 25
    original_voltage_v: 16
    quantity: 12
    series: kemet-t491
    note: >-
      Rated 25 V here rather than the factory 16 V. Compact Macintosh logic
      boards carry +/-12 V as well as +5 V, and which rail each of these
      positions decouples is not established; 16 V is only 1.33 times a 12 V
      rail, which is thin derating for a tantalum.
  - designators: [C9, C15]
    type: tantalum
    capacitance_uf: 1
    voltage_v: 50
    original_voltage_v: 50
    quantity: 2
    series: kemet-t491
