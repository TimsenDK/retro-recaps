board: analog
mains: true
x2_filter: unknown
revisions:
  - 630-0525
verification: verified
sources:
  - url: https://wiki.console5.com/wiki/Mac_Analog_Board:_630-0525
    note: >-
      Full designator-level table for the 630-0525 analog board, all 25
      electrolytic positions with factory ratings.
  - url: https://github.com/daanvdl/Classic-Analogboard-Late
    note: >-
      Schematic and PCB recreation of the same 820-0525-A / 630-0525 board,
      with a full bill of materials and a configuration table giving the
      component differences between the 110 V and 240 V builds.
notes:
  - >-
    This is the 100-120 V build of the late Classic II analog board. CP1 is
    rated 250 V and CP13 is populated with a capacitor. On the 220-240 V
    build of the same PCB, CP1 is rated 400 V and CP13 is a plain wire link;
    that build is tracked separately.
  - >-
    JP1 and JP2 select the mains topology. A wire link at JP1 and none at JP2
    is the voltage-doubler wiring used at 110 V, which is what this
    population expects. If the board in front of you has the link at JP2
    instead, it has been converted to 220-240 V full-bridge operation and the
    250 V parts recorded here are not correct for it.
  - >-
    This board is the machine's power supply as well as its video drive. The
    primary side holds a lethal charge after the machine is unplugged, and
    the CRT anode holds one independently of that.
  - >-
    CP16 is a 0.22 uF 250 V film capacitor on the mains input. Its safety
    class is not established, so it is not recorded as an X-class position
    below. Treat it as a safety capacitor until proven otherwise.
  - >-
    CF5 (220 nF/63 V), CF6 (100 nF/63 V) and CF7 (180 nF/63 V) are small
    film capacitors, outside the electrolytic recap scope tracked here, and
    are not listed as positions below.
  - Recap logic board before analog board.
