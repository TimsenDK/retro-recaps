id: mac-classic-ii-analog-220-240v
machine: mac-classic-ii
board: analog
revisions:
  - 820-0525-A (220-240V international)
verification: verified
sources:
  - url: https://wiki.retrotechcollection.com/Macintosh_Classic_II_Capacitor_Replacement_Guide
    note: Same source the handover cites. Confirms 26 designated positions
      (CF/CL/CP/CV series) with values in the same ranges used here.
  - url: https://github.com/daanvdl/Classic-Analogboard-Late
    note: Independent schematic recreation of the 820-0525-A board, not cited
      by the handover. Used to cross-check original (pre-recap) voltage for
      every designator below.
  - url: https://recapamac.com.au/macintosh-classic-analog/
    note: Confirms a dedicated "Macintosh Classic I + II Analog Board
      (220V-240V version)" guide exists, i.e. this is the correct variant for
      Denmark, distinct from the 110 V board.
notes:
  - >-
    This is the 220-240 V international analog board (Apple 820-0525-A
    family), the correct variant for Denmark. Do not merge with the separate
    110 V North American board.
  - >-
    CF5 (220 nF/63 V), CF6 (100 nF/63 V) and CF7 (180 nF/63 V) are small
    film/ceramic capacitors, outside the electrolytic recap scope tracked
    here, and are not listed as positions below.
  - Recap logic board before analog board.
