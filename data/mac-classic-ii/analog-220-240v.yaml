id: mac-classic-ii-analog-220-240v
machine: mac-classic-ii
board: analog
mains: true
x2_filter: unknown
revisions:
  - 630-0525 220-240 V build
verification: derived
notes:
  - >-
    This is the 220-240 V build of the late Classic II analog board - the
    same 630-0525 PCB as the 100-120 V build, stuffed differently. CP1 is
    rated 400 V and CP13 is a plain 0 ohm wire link rather than a capacitor.
    The 100-120 V build is tracked separately.
  - >-
    JP1 and JP2 select the mains topology. At 220-240 V the wire link sits at
    JP2 and the input runs as a full bridge; at 110 V it sits at JP1 and the
    input runs as a voltage doubler. If you find a 250 V capacitor in the CP1
    socket, or a capacitor rather than a wire link at CP13, the board is
    wired for 110 V and this list does not describe it.
  - >-
    CP19 and CP38 also differ between the two builds. Both are film
    capacitors, outside the electrolytic recap scope tracked here.
  - >-
    This board is the machine's power supply as well as its video drive. The
    primary side holds a lethal charge after the machine is unplugged, and
    the CRT anode holds one independently of that.
  - >-
    CP16 is a 0.22 uF 250 V film capacitor on the mains input. Its safety
    class is not established, so it is not recorded as an X-class position
    below. Treat it as a safety capacitor until proven otherwise.
  - >-
    CF5 (220 nF/63 V), CF6 (100 nF/63 V) and CF7 (180 nF/63 V) are small
    film capacitors, outside the electrolytic recap scope tracked here, and
    are not listed as positions below.
  - Recap logic board before analog board.
