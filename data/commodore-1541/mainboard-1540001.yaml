notes:
  - >-
    This PCB carries the drive's mains-fed supply section on the same board as
    the logic: the line switch and transformer primary, the rectifiers, and
    the large axial reservoir cans. Treat the board as live whenever the drive
    is plugged in, and remember that C51 and C52 stay charged after it is
    switched off - short them through a resistor before working on the board.
  - >-
    This board carries two separate axial filter positions at once, C51
    (6800 uF) and C52 (10000 uF) - not one position whose value varies by
    production run.
  - >-
    The board is the original long board, with four discrete 2114 RAMs. It is
    identified as PCB assembly 1540008 on the board itself and as assembly
    1540001 in the service manual's own contents page; 1540001 is also the
    schematic number for this board.
