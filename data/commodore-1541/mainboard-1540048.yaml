      Independent designator/value list, labelled "Type 2 (PCB Assm:
      1540048, 1540050, 250442/46)" on that page; no voltage ratings given
      for this revision.
  - url: https://www.lemon64.com/forum/viewtopic.php?t=76260
    note: >-
      Forum thread giving the generic 1541 capacitor value/voltage set
      (1 uF, 47 uF, 100 uF, 220 uF radial; 4700 uF and 6800 uF axial), used
      to cross-check values and voltages against the designator list above.
notes:
  - >-
    This is the most common 1541 longboard assembly group. It carries two
    separate axial filter positions at once, C16 (4700 uF)
    and C17 (6800 uF), both present together.
  - >-
    No voltage ratings are documented per designator for this revision; the
    voltages here follow the generic 1541 value list.
