notes:
  - >-
    This PCB carries the drive's mains-fed supply section on the same board as
    the logic: the line switch and transformer primary, the rectifiers, and
    the large axial reservoir cans. Treat the board as live whenever the drive
    is plugged in, and remember that C16 and C17 stay charged after it is
    switched off - short them through a resistor before working on the board.
  - >-
    This is the most common 1541 longboard assembly group. It carries two
    separate axial filter positions at once, C16 (4700 uF)
    and C17 (6800 uF), both present together.
  - >-
    The -01 assembly takes the Alps mechanism and the -03 the Newtronics one;
    the 250442 and 250446 boards take either, selected by a single jumper. The
    capacitor complement is the same across all of them.
