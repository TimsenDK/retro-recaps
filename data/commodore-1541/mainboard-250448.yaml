notes:
  - >-
    Single-sourced: no second independent list of this specific assembly
    group's capacitors was found. Capacitance values match the same
    recurring family used on the earlier 1540001 and 1540048 assembly
    groups of this machine (1 uF, 47 uF, 4700 uF, 6800 uF), so voltage
    ratings are inferred from those better-evidenced revisions rather than
    invented — same nominal component, different designator numbering.
  - >-
    This revision spreads the 47 uF value across four designators instead
    of two, and both large filter capacitors keep separate positions (as on
    the 1540048 group), consistent with the two-position PSU filter
    structure documented across this machine's boards.
