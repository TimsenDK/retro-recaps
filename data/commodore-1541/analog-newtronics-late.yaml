id: commodore-1541-analog-newtronics-late
machine: commodore-1541
board: analog
mains: false
revisions:
  - newtronics-late
verification: derived
notes:
  - >-
    Low-voltage motor speed control PCB mounted on a Newtronics/Mitsumi D500
    mechanism. It runs from the drive's 12 V rail and carries no mains
    voltage.
  - >-
    This is the four-capacitor build, with more of the speed-control circuit
    integrated. A Newtronics motor control PCB with seven capacitors is the
    earlier build and carries a different set; count the positions on the
    board to tell them apart.
  - >-
    A Newtronics mechanism is identified by its flipper-type door; an Alps
    mechanism has a push-down door and a different motor control PCB.
  - >-
    Construction is not established for the 0.47 uF position. The equivalent
    position on the Alps board is tantalum.
capacitors:
  - designators:
      - C1
    type: electrolytic-radial
    capacitance_uf: 0.47
