id: commodore-1541-analog-alps
machine: commodore-1541
board: analog
revisions:
  - alps
verification: derived
sources:
  - url: https://www.retroleum.co.uk/1541capacitors
    note: >-
      Independent list of the motor control PCB's capacitor set (3x 10 uF,
      2x 4.7 uF, 1x 2.2 uF, 1x 1 uF, 2x 0.47 uF, all described as radial);
      gives no voltage ratings and does not separate Alps from Newtronics
      mechanism positions.
notes:
  - >-
    This board also carries 4.7 uF, 2.2 uF, 1 uF and 0.47 uF positions. They
    are not listed here because no voltage rating is known for any of them;
    only the three 10 uF positions are recorded.
  - >-
    A second, electrically different motor-control board exists for
    Newtronics/Mitsumi mechanisms, reported to carry four to seven extra
    capacitors. Its capacitor list is not known. Check which mechanism the
    drive has.
capacitors:
  - type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 25
    quantity: 3
    series: panasonic-fr
    verification: derived
    note: >-
      Alps-mechanism motor control PCB only. The original part is axial; a
      radial replacement is used here. Reference designators are not known.
