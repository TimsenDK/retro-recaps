id: commodore-1541
name: Commodore 1541
family: commodore-drive
aliases:
  - VIC-1541
board_order:
  - mainboard
  - analog
notes:
  - >-
    Longboard chassis with an internal linear power supply. The PSU filter
    capacitors (the large axial cans) live on the same mainboard PCB as the
    logic circuitry on this model, so there is no separate PSU board file.
  - >-
    At least three mainboard PCB assembly generations exist with different
    reference-designator numbering and slightly different capacitor counts:
    1540001-01/1540001-03 (early), 1540048-01/1540050-01/250442/250446 (the
    common longboard revision), and 250448/251854
    (late). See the three mainboard-*.yaml files.
  - >-
    The drive mechanism (Alps vs Newtronics/Mitsumi) drives a separate motor
    speed control PCB with its own small-value capacitors, tracked in
    analog-alps.yaml. Only the Alps variant's three 10 uF positions are
    recorded there; the rest of that board is not known.
