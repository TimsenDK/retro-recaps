id: commodore-1541
name: Commodore 1541
family: commodore-drive
released: '1982'
about: >-
    The single-sided 5¼-inch floppy drive that came with the Commodore 64,
    holding 170 KB a disk. Around nine in ten C64 owners bought one, and its
    head-alignment failures — often caused by copy protection hammering the
    mechanism — are as well remembered as the drive is.
wikipedia: https://en.wikipedia.org/wiki/Commodore_1541
aliases:
  - VIC-1541
  - CBM 1541
  - 1541A
  - 1541 A-2
board_order:
  - mainboard
  - analog
notes:
  - >-
    Longboard chassis with an internal linear power supply. The rectifiers and
    the large axial reservoir capacitors sit on the same PCB as the logic, so
    there is no separate PSU board file - and the mainboard must be treated as
    a mains-carrying board.
  - >-
    Two mainboard assembly generations are covered here: the original long
    board (1540001/1540008, four discrete 2114 RAMs) and the shorter "CR"
    board and its successors (1540048, 1540050, 250442, 250446). The 250448
    and 251854 boards, previously grouped with these, belong to the 1541B and
    1541C and are covered under commodore-1541c.
  - >-
    The spindle motor runs from a separate motor speed control PCB on the
    mechanism, and three different versions of it exist: the Alps board, the
    early seven-capacitor Newtronics board, and the later four-capacitor
    Newtronics board. An Alps mechanism has a push-down door, a Newtronics
    mechanism a flipper-type door; count the capacitors on the motor PCB to
    tell the two Newtronics builds apart.
