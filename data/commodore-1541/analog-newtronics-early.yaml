id: commodore-1541-analog-newtronics-early
machine: commodore-1541
board: analog
mains: false
revisions:
  - newtronics-early
verification: derived
notes:
  - >-
    Low-voltage motor speed control PCB mounted on a Newtronics/Mitsumi D500
    mechanism. It runs from the drive's 12 V rail and carries no mains
    voltage.
  - >-
    This is the seven-capacitor build. A Newtronics motor control PCB with
    four capacitors is the later build and carries a different set; count the
    positions on the board to tell them apart.
  - >-
    A Newtronics mechanism is identified by its flipper-type door; an Alps
    mechanism has a push-down door and a different motor control PCB.
  - >-
    Construction is not established for the small values here. The equivalent
    0.47 uF and 2.2 uF positions on the Alps board are tantalum.
capacitors:
  - designators:
      - C1
    type: electrolytic-radial
    capacitance_uf: 1
    voltage_v: 35
    original_voltage_v: 35
    quantity: 1
    series: panasonic-fr
  - designators:
      - C2
      - C3
      - C5
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 35
    original_voltage_v: 35
