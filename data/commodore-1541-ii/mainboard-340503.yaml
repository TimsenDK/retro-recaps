id: commodore-1541-ii-mainboard-340503
machine: commodore-1541-ii
board: mainboard
mains: false
revisions:
  - "340503"
verification: verified
sources:
  - url: https://www.zimmers.net/anonftp/pub/cbm/schematics/drives/new/1541/1541-II_Service_Manual_Addendum_314862-01_(1988_Mar).pdf
    note: >-
      Commodore 1541/1541-II Service Manual Addendum, March 1988
      (PN 314862-01). Its component parts list for assembly 340503 gives
      C3, C22 and C23 as "ELEC 25V 10 U", Commodore part 900100-01; every
      other capacitor on the board is a ceramic or a trimmer.
  - url: https://wiki.console5.com/wiki/Commodore_1541
    note: >-
      1541-II section, listing C3, C22 and C23 at 10 uF 25 V and noting that
      some boards carry 50 V parts in those positions.
  - url: https://www.retroleum.co.uk/1541capacitors
    note: >-
      Independent list labelled "1541-ii (Assm: 340503)" on that page,
      giving 3x 10 uF 25 V radial for the mainboard.
notes:
  - >-
    These three positions are the only electrolytics on the board. C1, C2,
    C4-C10, C12-C19, C21 and C24-C28 are ceramics and C11 is a trimmer.
  - >-
    Some boards were built with 50 V parts in these positions; 25 V is the
    factory rating and is adequate.
  - >-
    The bulk supply filtering for this drive is in the external brick, not on
    this board, which is why the capacitor set is so much smaller than a 1541
    long board's.
capacitors:
  - designators:
      - C3
      - C22
      - C23
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 25
    original_voltage_v: 25
    quantity: 3
    series: panasonic-fr
