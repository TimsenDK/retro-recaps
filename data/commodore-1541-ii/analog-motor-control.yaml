verification: derived
sources:
  - url: https://www.retroleum.co.uk/1541capacitors
    note: >-
      Independent list of the 1541-II's motor control PCB capacitor set,
      given with full voltage ratings unlike the equivalent 1541-longboard
      list on the same page; single source, no designators given.
notes:
  - >-
    This capacitor set is not known to be the same on the Newtronics/Mitsumi
    and Chinon mechanism variants; it is listed here for both provisionally.
    Confirm against the mechanism in hand before relying on it for a Chinon
    drive.
  - Reference designators for this board are not known.
