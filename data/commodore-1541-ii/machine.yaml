id: commodore-1541-ii
name: Commodore 1541-II
family: commodore-drive
board_order:
  - mainboard
  - analog
notes:
  - >-
    The 1541-II moved the power supply to an external brick, unlike the 1541
    longboard and the 1541C. The brick shares its design with the Commodore
    1581's and has the same failure mode, a marginally rated diode bridge
    that fails as the electrolytics age. It is replaced as a whole unit
    rather than recapped, so no PSU board file is provided here; the shared
    design is documented under commodore-1581.
  - >-
    The small internal logic board that remains inside the drive carries a
    much smaller capacitor set than the 1541 longboard's mainboard, because
    the bulk PSU filtering moved out to the brick. It is tracked here as
    "mainboard" for board_order purposes even though it no longer carries
    PSU filter capacitors.
  - >-
    The 1541-II shipped with more than one drive mechanism,
    Newtronics/Mitsumi belt-drive and later Chinon direct-drive. Whether the
    capacitor sets differ between them is not known; see
    mainboard-340503.yaml and analog-motor-control.yaml.
