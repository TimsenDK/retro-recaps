id: commodore-1541-ii
name: Commodore 1541-II
family: commodore-drive
aliases:
  - 1541 II
  - 1541-2
board_order:
  - mainboard
  - analog
  - psu
notes:
  - >-
    The 1541-II takes its power from an external brick, P/N 312551-01, which
    is one design shared with the 1571-II and the 1581. Nothing inside the
    drive carries mains voltage. The brick is covered by psu.yaml here and by
    the identical file under commodore-1581.
  - >-
    The internal logic board carries only three electrolytics, because the
    bulk supply filtering that a 1541 long board holds moved out to the brick.
    It is tracked as "mainboard" for board_order purposes.
  - >-
    More than one drive mechanism shipped: the belt-driven Newtronics/Mitsumi
    D500, and the direct-drive Chinon FZ-501M and DS-50F. To tell them apart,
    look at the spindle: a Newtronics D500 has a drive belt from the motor to
    the spindle pulley and a speed-adjustment trimmer on its motor control
    PCB, while a Chinon or DS-50F drives the spindle directly, has no belt and
    has no speed adjustment. Only the Newtronics mechanism has published
    motor-control capacitor lists.
