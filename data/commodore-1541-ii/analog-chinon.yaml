notes:
  - >-
    Open: no capacitor list is published for the Chinon FZ-501M or the DS-50F
    mechanisms, and it is not established whether either carries a
    motor-control PCB with electrolytics at all. The Chinon spindle motor is
    direct drive with no belt and no speed adjustment, so it cannot share the
    belt-drive speed-control circuit of the Newtronics board, and the
    Newtronics capacitor lists must not be applied to it.
  - >-
    A Chinon or DS-50F mechanism has no drive belt and no speed-adjustment
    trimmer. If the mechanism has a belt, it is a Newtronics D500 and the
    Newtronics motor control lists apply instead.
