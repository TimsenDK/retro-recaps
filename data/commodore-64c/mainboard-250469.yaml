verification: derived
notes:
  - >-
    This is the C64-E shortboard. It is the board the C64C was built on, and
    it also appears in late breadbin cases, so a breadbin whose board is
    silkscreened 250469 takes this list rather than a longboard one.
    Its power section has a single 5 V rail rather than the two rails on the
    longboards and 250466, and its 9 V/12 V SID supply is generated by a
    transistor circuit rather than a regulator. Its capacitor designators
    and positions do not correspond to the longboard or 250466 numbering.
  - >-
    The bare PCB number 252311 belongs to this same assembly; a board
    silkscreened 252311 takes this list.
  - >-
    There is no 2200 uF axial reservoir at C19 on this board. That position
    belongs to the longboards and to 250466; the equivalent bulk capacitor
    here is C63.
  - >-
    C63 is 1000 uF on some boards of this assembly and 2200 uF on others,
    and its factory voltage rating is recorded both as 16 V and as 25 V. Read
    the part that comes out.
  - >-
    C66 is rated 35 V. Parts sold for this position at 25 V would be a
    downgrade.
