id: amiga-600-mainboard
machine: amiga-600
board: mainboard
external: false
revisions:
  - "1.0"
  - "1.1"
  - "1.3"
  - "1.5"
  - 2A
  - 2B
  - 2D
verification: verified
notes:
  - >-
    Nineteen electrolytic positions. Fifteen are surface-mount aluminium
    electrolytics; C237, C307, C408 and C811 are through-hole radial parts
    and are not surface mount, whatever a kit listing says. No tantalum is
    fitted anywhere on this board.
  - >-
    Every revision listed above carries this same complement. What changes
    between them is where the positions sit on the board, not which
    positions exist.
  - >-
    This board is marked verified on its designators, its capacitance values
    and the split between surface-mount and through-hole parts, all of which
    the schematic and the published lists agree on. It is not verified on the
    voltage ratings, which are recorded per position as unknown. Nobody
    involved has held one of these boards.
  - >-
    The factory voltage ratings are not recorded anywhere that can be
    checked, and the published figures disagree with one another at every
    position - most widely on the four 100 uF positions, where both 6.3 V
    and 25 V are claimed. Each position below therefore declares its
    original rating unknown, and the replacement rating chosen is safe under
    every figure in circulation.
  - >-
    A higher-rated surface-mount electrolytic comes in a taller and often
    wider can. Check the can against the space around the position before
    ordering, particularly under the keyboard and beside the drive.
  - >-
    Reversed silkscreen polarity is reported at C324 on some boards. Confirm
    the orientation against the schematic rather than against the board
    print before fitting a polarised part there.
  - >-
    The mainboard carries no battery. The clock cell is on the A601 trapdoor
    expansion; see amiga-600/machine.yaml.
capacitors:
  - designators:
      - C214
      - C306
      - C460
      - C612
    type: electrolytic-smd
    capacitance_uf: 10
    voltage_v: 35
    original_voltage_unknown: true
    quantity: 4
    series: panasonic-fk
  - designators:
      - C303
      - C304
      - C324
      - C334
      - C459
    type: electrolytic-smd
    capacitance_uf: 22
    voltage_v: 35
    original_voltage_unknown: true
    quantity: 5
    series: panasonic-fk
  - designators:
      - C821
      - C822
    type: electrolytic-smd
    capacitance_uf: 47
    voltage_v: 35
    original_voltage_unknown: true
    quantity: 2
    series: panasonic-fk
  - designators:
      - C235
      - C236
      - C239
      - C409
    type: electrolytic-smd
    capacitance_uf: 100
    voltage_v: 25
    original_voltage_unknown: true
    quantity: 4
    series: panasonic-fk
    note: >-
      The widest disagreement on the board: both 6.3 V and 25 V are claimed
      for these four. A 25 V part is safe under either reading, but its can
      is larger than the original; check the space.
  - designators:
      - C237
      - C307
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_unknown: true
    quantity: 2
    max_diameter_mm: 10
    max_lead_spacing_mm: 5
    series: panasonic-fr
    note: >-
      Through-hole radial, not surface mount.
  - designators:
      - C408
      - C811
    type: electrolytic-radial
    capacitance_uf: 1000
    voltage_v: 10
    original_voltage_unknown: true
    quantity: 2
    max_diameter_mm: 10
    max_height_mm: 16
    max_lead_spacing_mm: 5
    series: panasonic-fr
    note: >-
      Through-hole radial, not surface mount. The space above these two is
      shallow; a taller can fouls the shielding.
