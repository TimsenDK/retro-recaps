id: commodore-1541c
name: Commodore 1541C
family: commodore-drive
board_order:
  - mainboard
notes:
  - >-
    The 1541C keeps an internal linear power supply, unlike the later
    1541-II, which moved to an external brick. The internal supplies in the
    1541 and 1541C ran hot, which is what prompted that redesign.
  - >-
    The 1541C mainboard is a distinct, cost-reduced shortboard layout, not
    the 1541 longboard in a new case. Its reference-designator numbering
    does not match any of the 1541 longboard assembly groups. Do not carry
    the 1541 longboard's capacitor list over to this machine.
  - >-
    No full capacitor list for the 1541C mainboard is known. The board has
    to be counted, or a schematic or parts list found, before this entry can
    be completed.
