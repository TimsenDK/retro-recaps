notes:
  - >-
    This PCB carries the drive's mains-fed supply section on the same board as
    the logic: the line switch and transformer primary, the rectifiers, and
    the large axial reservoir cans. Treat the board as live whenever the drive
    is plugged in, and remember that C7 and C8 stay charged after it is
    switched off - short them through a resistor before working on the board.
  - >-
    This assembly spreads the 47 uF value across four designators, where the
    1541 long boards use two. Both large reservoir capacitors keep separate
    positions.
  - >-
    Voltages on the 1 uF and the two axial positions follow the equivalent
    positions on the 1541 long boards, which carry the same nominal values on
    the same rails. The factory ratings for this assembly are not published.
