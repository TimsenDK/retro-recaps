notes:
  - >-
    Open: the mechanism carries a separate motor speed control PCB, and no
    capacitor list for it has been found for either the Alps or the
    Newtronics build. The positions are not recorded here because no source
    gives them.
  - >-
    The 1541's motor control lists must not be applied to this board. They
    describe the boards fitted to that drive's mechanisms, and whether the
    1571's are the same assemblies is exactly what is unestablished.
  - >-
    The spindle speed trimmer VR1 is on this PCB, not on the logic board.
