id: commodore-1571
name: Commodore 1571
family: commodore-drive
aliases:
  - CBM 1571
  - 1571 double-sided
board_order:
  - logic
  - analog
  - psu
notes:
  - >-
    The double-sided 5.25" drive sold alongside the Commodore 128. Unlike the
    1541, the logic board carries no mains: the supply is a separate assembly
    inside the case, fed from an IEC inlet, and it is the part of this machine
    that is dangerous with the lid off.
  - >-
    Logic board assembly 310420 is shared with the 1570, which is the same
    drive fitted with a single-sided mechanism and different ROMs. A 1570
    takes the same logic board list.
  - >-
    The 1571CR is not this drive. It is the drive circuitry built into the
    Commodore 128DCR's motherboard, with a different chipset and different
    designators, and no list here applies to it. See commodore-128dcr.
  - >-
    The drive shipped with either an Alps or a Newtronics mechanism, each with
    its own front bezel and its own separate motor speed control PCB. No
    capacitor list for either has been found, and the 1541's motor board lists
    must not be assumed to apply.
  - >-
    Two physically different power supply assemblies were fitted - a switching
    supply and a larger linear one - and no component-level capacitor list has
    been found for either. The supply is recorded as a board so that the mains
    warning reaches the reader, not because its positions are known.
