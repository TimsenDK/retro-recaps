id: amiga-3000-daughterboard-rev6-9
machine: amiga-3000
board: daughterboard
revisions:
  - 6.x
  - 7.x
  - 8.x
  - 9.x
verification: verified
notes:
  - Through-hole (radial and axial), not SMD.
  - >-
    Daughterboard revisions 3.0 and 5.0 also exist and are not covered by
    this list.
  - >-
    C600-C602 are 220 uF, originally 16 V. C603's original rating is
    unsettled - it is documented both as 16 V and as 50 V - so it is listed
    separately at a rating that is safe under either reading, with no
    original_voltage_v asserted.
capacitors:
  - designators:
      - C751
    type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 50
    original_voltage_v: 35
    quantity: 1
    series: panasonic-fr
  - designators:
      - C600
      - C601
      - C602
    type: electrolytic-axial
    capacitance_uf: 220
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: vishay-021-asm
  - designators:
      - C603
    type: electrolytic-axial
    capacitance_uf: 220
    voltage_v: 63
    quantity: 1
    series: vishay-021-asm
    verification: derived
    note: >-
      Original voltage unsettled: documented both as 16 V and as 50 V. 63 V
      is a safe upward revision under either reading, and original_voltage_v
      is omitted.
