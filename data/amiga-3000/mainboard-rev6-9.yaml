    note: >-
      Full mainboard list with reference designators. Kit description
      confirms Rubycon/Nichicon/Panasonic through-hole parts.
  - url: https://forum.amiga.org/index.php?topic=64983.0
    note: >-
      Independent physical board reading of "A3000 COMMODORE B2 FAB 313312
      REV 9/03", quoting original manufacturer part markings and package
      sizes per designator. Confirms through-hole (radial), not SMD, and
      gives original (pre-recap) voltage ratings.
notes:
  - Through-hole (radial), not SMD.
  - >-
    The 4.7 uF and 22 uF groups were originally rated 35 V; 50 V is the
    replacement value.
  - Every 470 uF position on these boards is a 16 V part.
