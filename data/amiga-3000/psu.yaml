id: amiga-3000-psu
machine: amiga-3000
board: psu
mains: true
x2_filter: unknown
revisions:
  - PE-5161-1
  - PB-5161-1
verification: derived
notes:
  - >-
    This is a mains-carrying supply. The primary side holds a lethal charge
    after the unit is unplugged; discharge it before touching anything on
    that side of the transformer.
  - >-
    PE-5161-1 is the 240 V (EU) LiteOn supply used in the A3000; PB-5161-1
    is the equivalent 120 V unit on the same PCB with minor population
    differences. The values here are assumed to apply to both and are not
    confirmed for the 120 V variant.
  - >-
    The mains input filter of this supply is not inventoried. Film
    capacitors on the mains side are not covered by the list below, and no
    source establishes whether one is fitted. Inspect the input section, and
    replace any RIFA-marked film found there unconditionally, regardless of
    its rating.
  - >-
    C5 and C6 carry the same value and sit in series across the rectified
    mains bus, each holding roughly half of it. Replace both together with
    identical parts. A single capacitor fitted in place of the pair must be
    rated 400 V or more.
  - >-
    C28, C29 and C30 are all 3300 uF. The rating on C28 and C30 is
    documented inconsistently as 10 V and as 16 V; 16 V is recorded here,
    matching C29.
  - >-
    C34's factory rating is not established. Replacement lists give it as
    16 V, 25 V and 50 V; 50 V is recommended here, the highest of the three.
conversions:
  - title: Converting a 120 V unit (PB-5161-1) to 230 V
    steps:
      - >-
        Unplug the supply and discharge C5 and C6 before touching the primary
        side.
      - >-
        Remove the wire link between the C5/C6 junction and the pad marked
        110V beside bridge rectifier BD1. It makes the input a voltage
        doubler; left in place on 230 V mains it puts roughly twice the rated
        voltage across C5 and C6.
      - >-
        Replace the varistor RV21, between the AC inlet and L3, with a
        275 VAC part. The rating fitted to a 120 V unit is not recorded and
        may be too low for 230 V mains. Some boards print it as RV2.
      - >-
        Leave fuse F1 as it is; F5A 250 V suits 230 V operation.
      - >-
        On the mainboard, set jumper J200 to PAL for 50 Hz mains.
      - >-
        Relabel the input voltage on the supply and on the chassis.
    parts:
      - designators:
          - RV21
        description: Metal-oxide varistor, 275 VAC, 14 mm disc
        manufacturer: Littelfuse
        mpn: V275LA20AP
        quantity: 1
        note: >-
          Check the lead pitch against the RV21 holes before ordering; it is
          not recorded for the fitted part.
    notes:
      - >-
        PB-5161-1 and PE-5161-1 share one printed circuit board. Beyond the
        link and the varistor, no source lists what else differs between
        them.
