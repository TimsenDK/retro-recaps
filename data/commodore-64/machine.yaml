id: commodore-64
name: Commodore 64
family: commodore-8bit
aliases:
  - C64
board_order:
  - mainboard
notes:
  - >-
    Scope is the longboard breadbin, ASSY 250407. ASSY 250425 is not
    identical: C24 is 22 uF 25 V there, against 10 uF 25 V on 250407. Do not
    assume a 250425 board matches this data without checking C24 on the
    physical board.
  - >-
    The early ASSY 326298 board is out of scope. It differs at least at C88,
    which is 470 uF 50 V there against 1000 uF 25 V on 250407.
  - >-
    The external power supply brick is potted and fails by over-voltage,
    which destroys the machine. It is replaced as a unit, not recapped, so
    no PSU board file exists for this machine.
