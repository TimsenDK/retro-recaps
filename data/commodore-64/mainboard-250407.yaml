id: commodore-64-mainboard-250407
machine: commodore-64
board: mainboard
revisions:
  - "250407"
verification: verified
sources:
  - url: https://support.retrorewind.ca/en/blog/c64-assembly-250407
    note: Kit list with designators for ASSY 250407, cross-checked below.
  - url: https://www.zimmers.net/cbmpics/cbm/c64/C64ServiceManual.txt
    note: >-
      Official Commodore service manual parts lists, broken out by PCB
      assembly number (326298-01, 250407-04, 250425-01). Used to confirm
      original voltage ratings and check the 250425 equivalence claim.
  - url: https://www.lemon64.com/forum/viewtopic.php?t=73947
    note: >-
      Forum thread "Capacitor C107 Missing?" confirming C107/C108 are a
      genuine but inconsistently-populated low-profile position under the
      VIC-II shield, not present on every board.
notes:
  - >-
    250425 equivalence is not confirmed for every position: the service
    manual lists C24 as 22 uF 25 V on PCB #250425-01, versus 10 uF 25 V on
    #250407-04 and #326298-01. This file's designator list (C24 included at
    10 uF) is only confirmed correct for 250407.
  - >-
    C88: the Zimmers service manual shows no 16 V rating for C88 on any PCB
    variant — 326298-01 has 470 uF 50 V, and 250407-04/250425-01 already
    ship 1000 uF 25 V from the factory. No voltage upgrade is recorded for
    this position; it already shipped at 25 V.
  - >-
    C90: the Retro Rewind recap kit ships a 470 uF 25 V part here, but the
    Zimmers service manual lists the factory-original rating as 470 uF 50 V
    on all three PCB variants (326298, 250407, 250425). Kept at 50 V in this
    file to comply with the project's no-downgrade rule; the two sources
    disagree and the higher, better-evidenced rating was kept.
  - >-
    C107/C108: population varies by NTSC/PAL region and production batch
    (Lemon64 thread "Capacitor C107 Missing?"). Treat as present-if-found
    rather than guaranteed on every board.
