id: commodore-64-mainboard-250407
machine: commodore-64
board: mainboard
revisions:
  - "250407"
verification: verified
sources:
  - url: https://support.retrorewind.ca/en/blog/c64-assembly-250407
    note: Kit list with designators for ASSY 250407, cross-checked below.
  - url: https://www.zimmers.net/cbmpics/cbm/c64/C64ServiceManual.txt
    note: >-
      Official Commodore service manual parts lists, broken out by PCB
      assembly number (326298-01, 250407-04, 250425-01). Used to confirm
      original voltage ratings and check the 250425 equivalence claim.
  - url: https://www.lemon64.com/forum/viewtopic.php?t=73947
    note: >-
      Forum thread "Capacitor C107 Missing?" confirming C107/C108 are a
      genuine but inconsistently-populated low-profile position under the
      VIC-II shield, not present on every board.
notes:
  - >-
    This list is confirmed for ASSY 250407 only. C24 differs on ASSY 250425,
    which carries 22 uF 25 V in that position rather than 10 uF.
  - >-
    C88 shipped from the factory at 1000 uF 25 V on 250407 and on 250425,
    and at 470 uF 50 V on 326298. No voltage upgrade applies to this
    position.
  - >-
    C90 was originally 470 uF 50 V on all three PCB variants and is kept at
    50 V here. Some recap kits ship a 25 V part for this position, which
    would be a downgrade.
  - >-
    C107 and C108 are not populated on every board; population varies by
    NTSC/PAL region and by production batch. Treat them as present-if-found
    rather than guaranteed.
capacitors:
  - designators:
      - C8
      - C12
      - C13
      - C14
      - C15
      - C17
      - C24
      - C34
      - C57
      - C62
      - C65
      - C94
      - C102
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 25
    quantity: 13
    series: panasonic-fr
  - designators:
      - C107
      - C108
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 25
    quantity: 2
    series: panasonic-fr
    verification: derived
    note: >-
      Low-profile position inside the VIC-II shielded area. Not populated on
      every board (NTSC/PAL and batch dependent), and the voltage rating is
      unconfirmed.
  - designators:
      - C19
    type: electrolytic-axial
    capacitance_uf: 2200
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: vishay-021-asm
  - designators:
      - C88
    type: electrolytic-axial
    capacitance_uf: 1000
    voltage_v: 25
    quantity: 1
    series: vishay-021-asm
    note: >-
      Some 250407 boards use 470 uF here (326298 originally shipped 470 uF
      50 V); 1000 uF is the later factory-standard value and is safe to use.
  - designators:
      - C90
    type: electrolytic-axial
    capacitance_uf: 470
    voltage_v: 50
    quantity: 1
    series: vishay-021-asm
    note: >-
      Kept at the original 50 V rating. Some recap kits ship a 25 V part
      here, which would be a downgrade.
  - designators:
      - C91
    type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    original_voltage_v: 16
