id: commodore-64-mainboard-250407
machine: commodore-64
board: mainboard
revisions:
  - "250407"
verification: verified
sources:
  - url: https://support.retrorewind.ca/en/blog/c64-assembly-250407
    note: Kit list with designators for ASSY 250407, cross-checked below.
  - url: https://www.zimmers.net/cbmpics/cbm/c64/C64ServiceManual.txt
    note: >-
      Official Commodore service manual parts list for PCB assembly
      250407-04: C8/C13/C14/C15/C17/C24/C34/C57/C62/C65/C94/C102/C108 10 uF
      25 V, C19 2200 uF 16 V, C88 1000 uF 25 V, C90 470 uF 50 V, C91 100 uF
      16 V. No C12 and no C107 appear on that revision's list.
  - url: https://wiki.console5.com/wiki/Commodore_64
    note: >-
      Independent designator-level list headed "ASSY 250407", adding C107
      and C108 to the 10 uF 25 V group, annotating "C12 may be ceramic in
      other revisions", and giving C88 as "470uF (Rev B and earlier);
      1000uF (Rev C and later)".
  - url: https://www.retroleum.co.uk/c64-capacitors
    note: >-
      Three separate kits for this assembly - Rev A, artwork 251137 Rev B,
      and artwork 251137 Rev C - differing only at C88 (470 uF on Rev A and
      Rev B, 1000 uF on Rev C) and in the voltage offered for C88/C90. All
      three include C107 and C108 as low-profile parts.
  - url: https://www.lemon64.com/forum/viewtopic.php?t=73947
    note: >-
      Forum thread "Capacitor C107 Missing?" confirming C107/C108 are a
      genuine but inconsistently-populated low-profile position under the
      VIC-II shield, not present on every board.
notes:
  - >-
    This assembly spans revisions A to C and they differ at one capacitor
    position: C88 is 470 uF on rev B and earlier and 1000 uF on rev C and
    later. Every other position is common to all three, so this is one list
    with one revision-dependent value rather than three lists. Read the
    revision letter next to the assembly number before ordering C88.
  - >-
    C88 shipped at 1000 uF 25 V on rev C and on 250425; 326298 carries
    470 uF 50 V in the equivalent position.
  - >-
    C90 was originally 470 uF 50 V on all three PCB variants and is kept at
    50 V here. Some recap kits ship a 25 V part for this position, which
    would be a downgrade.
  - >-
    C107 and C108 are low-profile parts inside the VIC-II shielded area and
    are not populated on every board; population varies by NTSC/PAL region
    and by production batch. Treat them as present-if-found. Height is
    constrained by the shield.
  - >-
    C12 is an electrolytic on some boards of this assembly and a ceramic on
    others. Fit an electrolytic only where one came out.
  - >-
    C24 differs on ASSY 250425, which carries 22 uF 25 V in that position
    rather than 10 uF.
