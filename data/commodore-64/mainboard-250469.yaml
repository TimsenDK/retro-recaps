    note: >-
      Commodore C64/C64C service manual, parts list for PCB assembly
      #250469-01, identified there as version C64-E (schematic #252312).
  - url: https://support.retrorewind.ca/en/blog/c64-assembly-250469
    note: >-
      Kit list with designators for ASSY 250469, cross-checked against the
      service manual above. Two voltage values disagree; the manual's
      factory rating was kept in both cases, see board notes.
notes:
  - >-
    This is the C64-E shortboard used in the C64C and late breadbin cases.
    Its power section has a single 5 V rail rather than the two rails on
    the longboards and 250466, and its 9 V/12 V SID supply is generated by
    a transistor circuit rather than a regulator. Its capacitor designators
    and positions do not correspond to the longboard or 250466 numbering.
