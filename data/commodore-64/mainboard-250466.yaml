verification: verified
sources:
  - url: https://archive.org/stream/C64-C64C_Service_Manual_1992-03_Commodore/C64-C64C_Service_Manual_1992-03_Commodore_djvu.txt
    note: >-
      Commodore C64/C64C service manual, parts list for PCB assembly
      #250466-01, identified there as version C64-B3.
  - url: https://support.retrorewind.ca/en/blog/c64-assembly-250466
    note: >-
      Kit list with designators for ASSY 250466, cross-checked against the
      service manual above.
  - url: https://breadbox64.com/c64-hardware/commodore-64c/assy-250466/
    note: >-
      Independent confirmation that ASSY 250466 is the C64-B3 shortboard,
      and of C13's alternate designator C210.
notes:
  - >-
    This is the C64-B3 shortboard, built around two multiplexed DRAM chips
    in place of the longboard's eight. It carries the reduced capacitor
    complement introduced on 250425: a single 10 uF 25 V radial position
    (C13, also silkscreened C210) rather than a large group.
  - >-
    C15 is a 4.7 uF 16 V tantalum position, as on 250425.
  - >-
    C90 is 470 uF 25 V on this assembly. The longboards (250407, 250425,
    326298) all carry 470 uF 50 V in the equivalent position; this is a
    genuine factory rating, not a downgrade.
  - >-
    C200 is a 2.2 uF 50 V radial position not present on the longboard
    assemblies.
capacitors:
