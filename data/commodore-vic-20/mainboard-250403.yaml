id: commodore-vic-20-mainboard-250403
machine: commodore-vic-20
board: mainboard
revisions:
  - ASSY 250403
  - Rev D
verification: derived
sources:
  - url: https://www.arcticretro.com/2021/05/05/vic-20-capacitors-list/
    note: >-
      Rev D capacitor list (same source cited by the handover): 1x 2200 uF
      16V axial, 1x 100 uF 16V radial, 2x 10 uF 16V radial, 1x 47 uF 16V
      radial, 1x 1 uF 16V radial.
  - url: https://retroleum.co.uk/vic20-caps
    note: >-
      Independent kit-contents list for "250403/251040": 1x 1 uF radial, up
      to 3x 10 uF radial (only 2 required for plain 250403), 1x 47 uF radial
      (251040 variant only, not plain 250403), 1x 100 uF radial, 1x 2200 uF
      axial.
  - url: https://wiki.retrotechcollection.com/Commodore_VIC-20_Capacitor_Replacement_Guide
    note: >-
      Independent guide; states Commodore deleted the on-board 7805 on ASSY
      250403 so the 4700 uF can is absent and the largest can is the 2200 uF
      (agrees with the other two sources on that point).
notes:
  - >-
    The plain 250403 board has no 47 uF position; that position belongs to
    the 251040 sub-variant. If the board is marked 251040, add 1x 47 uF 25 V
    radial. Some capacitor lists for this board include the 47 uF position
    without drawing the distinction.
  - >-
    No reference designators are known for this board; positions are value
    and quantity only.
