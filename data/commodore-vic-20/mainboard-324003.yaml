id: commodore-vic-20-mainboard-324003
machine: commodore-vic-20
board: mainboard
mains: false
revisions:
  - "324003"
verification: verified
notes:
  - >-
    This is the long board with the 2-pin locking power connector and an
    on-board 7805, so C39 is the large 4700 uF can downstream of that
    regulator. The DIN-connector board, ASSY 250403, has no on-board
    regulator and a different designator scheme entirely; see
    mainboard-250403.yaml.
  - >-
    A second, disjoint designator set exists on an earlier VIC-20 long board
    - C1, C3, C7, C9, C11 and C22 - which is a different PCB, not another
    reading of this one. If the board's designators run in that range rather
    than C13 to C44, use mainboard-rev-e.yaml.
  - >-
    C39 is an axial can; the other seven positions are radial.
capacitors:
  - designators:
      - C13
      - C16
    type: electrolytic-radial
    capacitance_uf: 1
    voltage_v: 50
    original_voltage_v: 50
    quantity: 2
    series: panasonic-fr
  - designators:
      - C23
      - C24
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 25
    original_voltage_v: 16
    quantity: 2
    series: panasonic-fr
  - designators:
      - C25
    type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
  - designators:
      - C31
      - C44
    type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    original_voltage_v: 16
    quantity: 2
    series: panasonic-fr
  - designators:
      - C39
