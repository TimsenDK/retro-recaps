id: commodore-vic-20-mainboard-324003
machine: commodore-vic-20
board: mainboard
revisions:
  - ASSY 324003
verification: derived
sources:
  - url: https://retroleum.co.uk/vic20-caps
    note: >-
      Independent kit-contents list for the "324003 Original Long Board";
      gives a different designator set (C13,C16,C23,C24,C25,C31,C39,C44) for
      the same ASSY number than the one used here — see note below.
  - url: https://wiki.retrotechcollection.com/Commodore_VIC-20_Capacitor_Replacement_Guide
    note: >-
      Independent guide; corroborates "8 capacitors total" for this board
      and the single large 4700 uF main +5V filter can, without giving a
      full designator list.
notes:
  - >-
    The designators recorded here - C1, C3, C7, C9, C11 and C22 - are
    unconfirmed for this board.
  - >-
    A wholly different designator set is also documented for ASSY 324003:
    C13, C16, C23, C24, C25, C31, C39 and C44, together with a 22 uF radial
    position not listed here. This may be a different PCB layout sharing the
    same assembly number. Unresolved - check the board.
  - The two 10 uF positions have no known designators.
capacitors:
