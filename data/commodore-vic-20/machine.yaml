id: commodore-vic-20
name: Commodore VIC-20
family: commodore-8bit
aliases:
  - VIC-20
  - VC-20
  - VIC20
board_order:
  - mainboard
notes:
  - >-
    Two incompatible mainboard variants exist, distinguished by the power
    connector: ASSY 324003 (2-pin locking PSU connector, on-board 7805
    regulator) and ASSY 250403 (DIN/circular connector, no on-board
    regulator). A given machine has one or the other, never both. See
    mainboard-324003.yaml and mainboard-250403.yaml.
  - >-
    The 250403/DIN board depends on an external PSU brick that supplies
    regulated +5 V directly (the on-board 7805 was deleted on this
    revision); like the C64 brick, this is a sealed/potted unit and is
    replaced as a whole rather than recapped, so no PSU board file is
    provided for it. The 324003/2-pin board regulates on-board, so its
    external brick is a simpler AC transformer with lower risk, but is
    likewise not covered by a PSU board file here.
