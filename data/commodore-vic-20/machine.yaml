id: commodore-vic-20
name: Commodore VIC-20
family: commodore-8bit
released: '1980'
about: >-
    Commodore's first colour home computer, built around a 6502 at about 1 MHz
    with 5 KB of RAM. It was sold through high-street shops rather than
    computer dealers, and became the first computer of any kind to pass a
    million units.
wikipedia: https://en.wikipedia.org/wiki/VIC-20
aliases:
  - VIC-20
  - VIC20
  - VC-20
  - VC20
  - VIC-1001
board_order:
  - mainboard
notes:
  - >-
    Three mainboard designs are documented here, and they share no capacitor
    list. Identify the board first, by its power connector and then by the
    range its electrolytic designators run in: a 2-pin locking connector with
    designators C13 to C44 is ASSY 324003; a 2-pin connector with designators
    C1 to C22 is the earlier long board, mainboard-rev-e.yaml; a circular DIN
    connector is ASSY 250403.
  - >-
    The 250403/DIN board has no on-board 7805 - the +5 V rail is regulated
    inside the external brick - so its largest can is 2200 uF. The two 2-pin
    boards regulate on-board and each carry a 4700 uF filter downstream of
    the regulator.
  - >-
    The external supply is not covered by a board file for either connector
    type. The DIN board's brick supplies regulated +5 V directly and is a
    sealed, potted unit replaced whole rather than recapped; the 2-pin
    board's brick is a plain AC transformer.
  - >-
    Commodore published a separate "Version E" main logic board schematic
    for this machine, with no parts list. Whether that drawing describes the
    C1-to-C22 board covered by mainboard-rev-e.yaml or a fourth board is not
    established, so a board matching none of the three lists here is
    possible.
