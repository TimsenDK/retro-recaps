id: commodore-128d-psu
machine: commodore-128d
board: psu
revisions:
  - "310639-02"
verification: derived
sources:
  - url: https://blog.worldofjani.com/?p=7915
    note: >-
      "C128D PAL PSU recap / capacitor list & fan" — measured capacitor
      list, with designators, values, voltages and physical sizes, for the
      plastic-case C128D's internal switching PSU, part 310639-02.
notes:
  - >-
    This is the plastic-case C128D's internal switching PSU, part 310639-02.
    It is distinct from the metal-case C128DCR's internal PSU, which uses
    different components entirely and is not covered by this file.
  - >-
    Values here are the original as-built ratings; no voltage upgrades are
    applied. They are unconfirmed against a second unit, so confirm before
    ordering in quantity.
