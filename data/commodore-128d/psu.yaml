id: commodore-128d-psu
machine: commodore-128d
board: psu
mains: true
x2_filter: unknown
revisions:
  - "310639-02"
verification: derived
notes:
  - >-
    This is the plastic-case C128D's internal switching PSU, part 310639-02,
    the 220 V PAL unit. The metal-case C128DCR uses an entirely different
    internal supply; see commodore-128dcr. A separate Japanese-market C128D
    supply design also exists and is not this board.
  - >-
    This is an off-line switching supply: C5 and C23 sit on the rectified
    mains and hold a lethal charge after the machine is unplugged. Discharge
    them before touching the primary side.
  - >-
    No mains-input film capacitor is recorded for this board, and nothing
    establishes that there is none. Any X- or Y-class film capacitor found
    across or from the mains input is replaced unconditionally: the
    metallised-paper parts of this era fail by cracking, smoking and
    sometimes catching fire, and they fail whether or not the machine has
    been used.
  - >-
    The values here are unconfirmed against a second unit; confirm before
    ordering in quantity.
capacitors:
