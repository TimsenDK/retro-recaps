id: commodore-128d
name: Commodore 128D
family: commodore-8bit
released: '1985'
about: >-
    The Commodore 128 in a plastic desktop chassis with the 1571 drive built
    in and a detachable keyboard, sold mainly in Europe. The electronics are
    the 128's.
wikipedia: https://en.wikipedia.org/wiki/Commodore_128
aliases:
  - C128D
  - C-128D
  - Commodore 128D
board_order:
  - mainboard
  - psu
notes:
  - >-
    This is the plastic-case C128D with a detachable keyboard and an
    internal power supply. The later metal-case C128DCR ("cost-reduced")
    carries a different mainboard and a different internal supply and is a
    separate machine here; see commodore-128dcr. Tell them apart by the
    case: plastic with a carrying handle is this machine, sheet metal is the
    DCR.
  - >-
    The internal supply is not one design. This entry covers the 220 V PAL
    unit, part 310639-02; separate German-market and Japanese-market supply
    schematics exist for this machine. A unit that does not match psu.yaml
    position for position is not necessarily mis-identified - read the part
    number on the supply.
  - >-
    The 128D has a built-in 1571 disk drive on its own board, which is not
    covered by this entry and has no data of its own here yet. Its
    capacitors are not included in this machine's parts count.
