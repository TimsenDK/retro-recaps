id: mac-se30-logic
machine: mac-se30
board: logic
revisions:
  - 820-0260
verification: verified
sources:
  - url: https://wiki.console5.com/wiki/Macintosh_SE
    note: >-
      Designator-level table headed "SE/30 Logic Board: 820-0260", giving the
      full designator-to-value mapping for all thirteen positions.
  - url: https://www.oldsilicon.com/personal-computers/mac-se30/
    note: >-
      Independent teardown of the same board. Confirms the complement -
      ten 47 uF/16 V, one 1 uF/50 V, one 220 uF/16 V, one 470 uF/16 V - and
      the +5 V, +/-12 V and sound rails the positions sit on.
notes:
  - >-
    The 47 uF and 1 uF positions are surface mount. This project prefers
    tantalum over wet electrolytic there; the 47 uF positions must be 25 V
    rated when tantalum.
  - >-
    C2 and C11 are axial through-hole cans, not surface mount.
  - >-
    The electrolyte from these positions creeps under the adjacent ICs and
    eats traces, so the board is recapped and washed rather than only
    recapped.
  - >-
    Designators repeat across the boards of this machine with different
    values. C2, C7, C9, C11 and C13 also exist on the analog board; C7 and
    C8 also exist in the Astec power supply. Never carry a designator
    between boards.
  - Recap logic board before analog board.
capacitors:
  - designators: [C1, C3, C4, C5, C7, C8, C9, C10, C12, C13]
    type: tantalum
    capacitance_uf: 47
    voltage_v: 25
    original_voltage_v: 16
    quantity: 10
    series: kemet-t491
    note: >-
      Surface mount. These positions must be 25 V rated when using tantalum.
  - designators: [C2]
    type: electrolytic-axial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: vishay-021-asm
    note: Axial through-hole position on the +12 V filter.
  - designators: [C6]
    type: tantalum
    capacitance_uf: 1
    voltage_v: 50
    original_voltage_v: 50
    quantity: 1
    series: kemet-t491
    note: Surface mount.
  - designators: [C11]
    type: electrolytic-axial
    capacitance_uf: 220
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: vishay-021-asm
    note: Axial through-hole position on the +5 V filter.
