id: mac-se30-logic
machine: mac-se30
board: logic
revisions:
  - all known
verification: derived
sources:
  - url: https://www.oldsilicon.com/personal-computers/mac-se30/
    note: Directly retrieved, independent of console5/recapamac (the
      handover's cited sources). Confirms the same overall structure as the
      spreadsheet - ten 47 uF/16 V SMD positions, one 1 uF/50 V SMD position
      (C6), and axial 220 uF/16 V and 470 uF/16 V positions with Vishay part
      numbers MAL213825221E3 / MAL211835471E3 - but see the caveat below,
      since its own designator table for the 47 uF group does not agree with the
      spreadsheet's, and one extraction even listed C2 and C11 (the axial
      positions) a second time as 47 uF SMD entries. Treated as confirming
      the value/count structure, not the exact designator-to-value mapping.
notes:
  - >-
    The designators on the 47 uF SMD group are unconfirmed. Two different
    sets are documented for this board - C1, C3, C4, C5, C7, C8, C9, C10,
    C12 and C13, used here, and a longer set that includes C2 and C11, which
    are the axial positions elsewhere on the same board. Only the counts and
    values are settled: ten 47 uF SMD, one 1 uF SMD at C6, one 220 uF axial
    and one 470 uF axial.
  - >-
    Surface mount. This project prefers tantalum over wet electrolytic for
    Macintosh SMD positions; the 47 uF positions must be 25 V rated when
    tantalum.
  - >-
    C2 and C11 on this board are axial, not SMD. Both also have
    same-numbered positions on the analog board and in the Sony PSU with
    different values - never carry a designator between boards.
  - Recap logic board before analog board.
capacitors:
  - designators: [C1, C3, C4, C5, C7, C8, C9, C10, C12, C13]
    type: tantalum
    capacitance_uf: 47
    voltage_v: 25
    original_voltage_v: 16
    quantity: 10
    series: kemet-t491
    verification: derived
    note: >-
      47 uF SMD positions must be 25 V rated when using tantalum. The
      designators on this group are unconfirmed - see board notes.
  - designators: [C6]
    type: tantalum
    capacitance_uf: 1
    voltage_v: 50
    quantity: 1
    series: kemet-t491
    verification: verified
  - designators: [C11]
    type: electrolytic-axial
    capacitance_uf: 220
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: vishay-021-asm
    verification: derived
    note: >-
      Logic board position - do not confuse with the C11 positions on the
      analog board or in the Sony PSU, which are different components.
      Original part Vishay MAL213825221E3. The designator is unconfirmed -
      see board notes.
  - designators: [C2]
    type: electrolytic-axial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: vishay-021-asm
    verification: derived
    note: >-
      Original part Vishay MAL211835471E3. The designator is unconfirmed -
      see board notes.
