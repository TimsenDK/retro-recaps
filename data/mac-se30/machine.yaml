id: mac-se30
name: Macintosh SE/30
family: macintosh
released: '1989-01'
about: >-
    The SE's case around a 32-bit 68030 at 15.7 MHz, with a high-density
    floppy drive and room for far more RAM than any compact Mac before it. It
    is the fastest of the black-and-white compacts.
wikipedia: https://en.wikipedia.org/wiki/Macintosh_SE/30
aliases:
  - Mac SE/30
  - SE/30
  - SE30
board_order:
  - logic
  - analog
  - psu
notes:
  - >-
    Three power supply builds are documented for the SE and SE/30 together -
    Sony CR-44M, Astec AA13800 and Apple 820-0385-A (Hitachi). Their
    capacitor sets are entirely different and are tracked as separate files.
    Which of them shipped in an SE/30 specifically is not established, and
    Apple part number 699-5047 appears on more than one of them, so read the
    label on the module.
  - >-
    The analog board is the 630-0147 design shared with the Macintosh SE.
  - >-
    Designators repeat across the boards with different values. C2, C7, C9,
    C11 and C13 are on both the logic and the analog board; C7 and C8 are on
    both the logic board and the Astec supply; C19 and C24 are on both the
    analog board and the Astec supply. Never carry a designator between
    boards.
batteries:
  - kind: pram
    action: replace
    note: 1/2 AA PRAM battery.
