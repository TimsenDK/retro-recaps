id: mac-se30-psu-hitachi
machine: mac-se30
board: psu
mains: true
x2_filter: listed
revisions:
  - 820-0385-A
verification: derived
sources:
  - url: https://wiki.console5.com/wiki/Macintosh_SE
    note: >-
      Designator-level table headed "Power Supply: Apple 820-0385-A /
      Hitachi", plus the safety-capacitor note quoted below.
notes:
  - >-
    Off-line switching supply. C206 sits on the rectified mains bus at
    400 V and holds a lethal charge after the machine is unplugged;
    discharge it before working on the board.
  - >-
    The designators on this supply run in the C1xx to C4xx ranges and do not
    collide with any other board in the machine.
  - >-
    Three power supply builds are documented for the SE and SE/30 together -
    Sony CR-44M, Astec AA13800 and Apple 820-0385-A (Hitachi). Which of them
    shipped in an SE/30 specifically is not established, so read the label on
    the module before choosing a list.
capacitors:
  - designators: [C101, C102, C304, C402, C408]
    type: electrolytic-radial
    capacitance_uf: 10
    voltage_v: 25
    original_voltage_v: 25
    quantity: 5
    series: panasonic-fr
  - designators: [C206]
    type: electrolytic-snap-in
    capacitance_uf: 620
    voltage_v: 400
    original_voltage_v: 400
    quantity: 1
    series: nichicon-lgn
    note: >-
      Primary bulk reservoir on the rectified mains bus. Snap-in terminals
      do not fit a radial-leaded footprint.
  - designators: [C305, C309, C310]
    type: electrolytic-radial
    capacitance_uf: 1000
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: panasonic-fr
  - designators: [C306, C311, C312]
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 3
    series: panasonic-fr
  - designators: [C307]
    type: electrolytic-radial
    capacitance_uf: 1000
    voltage_v: 25
    original_voltage_v: 10
    quantity: 1
    series: panasonic-fr
  - designators: [C308]
    type: electrolytic-radial
    capacitance_uf: 4700
    voltage_v: 10
    original_voltage_v: 10
    quantity: 1
    series: panasonic-fr
    note: >-
      Largest can in the supply, on the 5 V rail. The factory rating is kept
      because a higher-voltage part in this capacitance does not fit the
      original footprint.
  - designators: [C401]
    type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    original_voltage_v: 25
    quantity: 1
    series: panasonic-fr
  - designators: [C404]
    type: electrolytic-radial
    capacitance_uf: 22
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
  - designators: [C412]
    type: electrolytic-radial
    capacitance_uf: 100
    voltage_v: 25
    original_voltage_v: 10
    quantity: 1
    series: panasonic-fr
  - designators_unknown: true
    type: film-y2
    capacitance_uf: 0.0047
    voltage_v: 300
    original_voltage_unknown: true
    quantity: 3
    series: tdk-b32021
    note: >-
      Metallized-paper RIFA safety capacitors of 4700 pF on the mains input.
      Not fitted to every supply; where they are, there are three. They
      crack, absorb moisture and fail explosively, so they are replaced
      unconditionally when found. The factory AC rating is not recorded
      anywhere retrievable; 300 VAC is the rating of the replacement class.
