id: mac-se30-psu-sony
machine: mac-se30
board: psu
revisions:
  - Sony CR-44
verification: derived
notes:
  - The values here are unconfirmed. Count the board before ordering parts.
  - >-
    This PSU is shared between the Macintosh SE and SE/30 (both use the Sony
    CR-44). The SE/30 may also be fitted with an Aztec or Hitachi PSU, which
    are reported to differ but for which no list is known - see
    machine.yaml.
  - RIFA X2 mains film capacitors are replaced unconditionally.
  - >-
    C7/C8/C11/C19 designators also exist on the logic and analog boards with
    different values - never carry a designator between boards on this
    machine.
capacitors:
  - designators: [C7, C8]
    type: electrolytic-snap-in
    capacitance_uf: 330
    voltage_v: 200
    quantity: 2
    series: nichicon-lgn
    note: Primary-side filter capacitors.
  - designators: [C19]
    type: electrolytic-radial
    capacitance_uf: 220
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
  - quantity: 1
    type: electrolytic-radial
    capacitance_uf: 220
    voltage_v: 25
    original_voltage_v: 16
    series: panasonic-fr
    note: >-
      Second 220 uF/25 V position on this board. It is designated C25 on
      some Sony CR-44 revisions and C28 on others, so no designator is
      recorded here.
  - designators: [C21]
    type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 63
    quantity: 1
    series: panasonic-fr
  - designators: [C23]
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
  - designators: [C35]
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
  - quantity: 1
    type: electrolytic-radial
    capacitance_uf: 470
    voltage_v: 25
    original_voltage_v: 16
    series: panasonic-fr
    note: >-
      Third 470 uF/25 V position on this board. Its designator varies
      between Sony CR-44 revisions, so none is recorded here.
  - designators: [C24]
    type: electrolytic-radial
    capacitance_uf: 1200
    voltage_v: 25
    original_voltage_v: 10
    quantity: 1
    series: panasonic-fr
  - designators: [C31]
    type: electrolytic-radial
    capacitance_uf: 2200
    voltage_v: 25
    original_voltage_v: 16
    quantity: 1
    series: panasonic-fr
  - designators: [C32]
    type: electrolytic-radial
    capacitance_uf: 47
    voltage_v: 25
    quantity: 1
    series: panasonic-fr
  - quantity: 2
    type: film-x2
    capacitance_uf: 0.1
    voltage_v: 275
    series: kemet-r46
    note: >-
      Mains RIFA netfilter capacitors, replaced unconditionally. No
      designators are known.
