name: pages

# Publishes the generated site to GitHub Pages.
#
# This workflow does nothing until Pages is enabled on the repository with
# "GitHub Actions" as the source (Settings -> Pages). Until then it fails at
# the deploy step, which is the intended safety property: merging this file
# does not put anything on the public web.
#
# The dataset carries mains-voltage safety warnings. The build is gated on
# validate.yml passing, so a dataset with errors in it never reaches a reader.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-done: a partially
# written site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # The site is generated from the dataset, so an invalid dataset must
      # never be published. This repeats validate.yml deliberately rather
      # than trusting that it ran.
      - name: Validate the dataset
        run: python -m tools validate --root .

      - name: Build the site
        run: python -m tools build-site --root . --out build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
