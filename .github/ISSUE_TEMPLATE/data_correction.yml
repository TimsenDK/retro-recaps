name: Data correction
description: A capacitor list or board map position is wrong, incomplete, or missing an entry
title: "[data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Corrections need evidence — either a source URL or a photo of your own
        board. Without one this cannot be merged, however plausible it looks.

  - type: input
    id: machine
    attributes:
      label: Machine
      description: Which machine, and which board revision if you know it
      placeholder: Amiga 500 rev 6A, mainboard
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Board
      description: Mainboard, PSU, analog board, logic board, daughterboard, paddle
      placeholder: PSU
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What the data says now
      description: Paste the entry, or say "missing entirely"
    validations:
      required: true

  - type: textarea
    id: correct
    attributes:
      label: What it should say
      description: |
        Designators, capacitance, voltage, type and quantity as far as you know
        them — or, for a board map position, where the capacitor actually is.
        Say which parts you are unsure about.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        A source URL, or "counted on my own board" with a photo attached. Both
        is better than either.
    validations:
      required: true

  - type: dropdown
    id: confidence
    attributes:
      label: How confident are you?
      options:
        - Verified — a source states this for this exact board revision
        - Derived — inferred from a related revision or kit
        - Counted on my own board
    validations:
      required: true
