# A supplier needs only a search template to be useful: a part with no curated
# stock number still resolves to a search on its manufacturer part number.
# product_url is used when reference/offers/<id>.yaml lists a stock number.

- id: mouser
  name: Mouser Electronics
  region: DK
  product_url: "https://www.mouser.dk/ProductDetail/{sku}"
  search_url: "https://www.mouser.dk/c/?q={mpn}"

- id: digikey
  name: DigiKey
  region: DK
  search_url: "https://www.digikey.dk/en/products/result?keywords={mpn}"

- id: reichelt
  name: Reichelt Elektronik
  region: DE
  search_url: "https://www.reichelt.de/index.html?ACTION=446&SEARCH={mpn}"

- id: farnell
  name: Farnell
  region: DK
  search_url: "https://dk.farnell.com/search?st={mpn}"
