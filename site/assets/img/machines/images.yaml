# Machine photographs: caption / attribution data for the site generator.
#
# One entry per machine id (directory name under data/). Keys:
#   file         image at ~1200 px on the long edge, relative to this directory
#   card         smaller variant for index cards, relative to this directory
#   author       photographer, spelled as the source file credits them
#   licence      licence name including version
#   licence_url  deed URL, empty for public-domain files
#   source_url   Wikimedia Commons file page the image was retrieved from
#
# CC BY and CC BY-SA files must be captioned with author + licence. Full
# compliance record, including retrieval date, is in CREDITS.md.
# Machines absent from this file have no acceptably licensed photograph.

retrieved: 2026-08-17
source: Wikimedia Commons

