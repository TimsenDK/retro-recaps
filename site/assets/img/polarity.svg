<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img">
<title>How capacitor polarity is marked, on the part and on the board</title>
<desc>Three panels. Left: an upright electrolytic capacitor with a stripe down one side; the lead on the stripe side is short and negative, the far lead is long and positive. Middle: the board silkscreen, an outline with one half shaded for the negative side and a square pad or printed plus for the positive side. Right: the same capacitor fitted the wrong way round, crossed out, venting at the top.</desc>
<style>
svg:root{color:#22201c}
@media(prefers-color-scheme:dark){svg:root{color:#ece7dc}}
@media print{svg:root{color:#000}}
.pol-s{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pol-f{fill:currentColor;stroke:none}
.pol-shade{fill:currentColor;fill-opacity:.22;stroke:none}
.pol-h{font:700 11px sans-serif;letter-spacing:.08em;fill:currentColor}
.pol-t{font:10.5px sans-serif;fill:currentColor}
.pol-g{font:700 17px sans-serif;fill:currentColor}
.pol-bad{fill:none;stroke:var(--warn-rule,#b13c22);stroke-width:4;stroke-linecap:round}
</style>

<!-- panel 1: the part -->
<text class="pol-h" x="70" y="16" text-anchor="middle">THE PART</text>
<rect class="pol-s" x="40" y="34" width="60" height="84" rx="6"/>
<rect class="pol-f" x="46" y="40" width="16" height="72"/>
<text class="pol-g" x="26" y="84" text-anchor="middle">&#8722;</text>
<text class="pol-g" x="114" y="84" text-anchor="middle">+</text>
<path class="pol-s" d="M55 118v24M85 118v52"/>
<text class="pol-t" x="70" y="192" text-anchor="middle">Stripe = minus side</text>
<text class="pol-t" x="70" y="207" text-anchor="middle">Long lead = plus</text>

<!-- panel 2: the board -->
<text class="pol-h" x="200" y="16" text-anchor="middle">THE BOARD</text>
<rect class="pol-s" x="152" y="34" width="96" height="136" rx="3"/>
<path class="pol-shade" d="M200 46A32 32 0 0 0 200 110Z"/>
<circle class="pol-s" cx="200" cy="78" r="32"/>
<circle class="pol-s" cx="186" cy="78" r="6.5"/>
<rect class="pol-s" x="207" y="71" width="14" height="14"/>
<text class="pol-g" x="214" y="61" text-anchor="middle">+</text>
<path class="pol-s" d="M166 132h68M166 146h40"/>
<text class="pol-t" x="200" y="192" text-anchor="middle">Shaded half = minus</text>
<text class="pol-t" x="200" y="207" text-anchor="middle">Square pad or + = plus</text>

<!-- panel 3: backwards -->
<text class="pol-h" x="330" y="16" text-anchor="middle">BACKWARDS</text>
<path class="pol-s" d="M310 34l-5-10M322 34V20M334 34l5-10"/>
<rect class="pol-s" x="300" y="34" width="60" height="84" rx="6"/>
<rect class="pol-f" x="338" y="40" width="16" height="72"/>
<path class="pol-s" d="M315 118v24M345 118v24"/>
<path class="pol-bad" d="M304 42l52 66M356 42l-52 66"/>
<text class="pol-t" x="330" y="192" text-anchor="middle">Wrong way round: it heats,</text>
<text class="pol-t" x="330" y="207" text-anchor="middle">vents and can burst</text>

<text class="pol-t" x="200" y="228" text-anchor="middle">Match the stripe to the shaded half. Note how each old part sits before you pull it.</text>
</svg>
